<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>404 | Page not found</title>
<style>
  :root{color-scheme:light dark;--bg:#f6f8fc;--text:#14192b;--muted:#4a5470;--accent:#2f4bd1;--on-accent:#fff}
  @media (prefers-color-scheme:dark){:root{--bg:#0b1020;--text:#edf2ff;--muted:#9ba8c7;--accent:#8fa8ff;--on-accent:#0b1020}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6}
  h1{margin:0;font-size:clamp(5rem,25vw,9rem);line-height:1;letter-spacing:-.05em;color:var(--accent)}
  h2{margin:8px 0 12px;font-size:1.5rem}
  p{margin:0 0 24px;color:var(--muted)}
  a{display:inline-block;padding:12px 24px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-weight:600;text-decoration:none}
  a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<main>
  <h1>404</h1>
  <h2>Page not found</h2>
  <p>Sorry, the page you are looking for doesn't exist or has moved.</p>
  <a href="/">Back to homepage</a>
</main>
</body>
</html>
