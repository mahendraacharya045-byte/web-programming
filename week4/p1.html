<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Button Click Counter</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #f4f6f8;
      color: #1f2937;
    }

    main {
      width: min(90vw, 28rem);
      padding: 2.5rem;
      text-align: center;
      background: white;
      border-radius: 1rem;
      box-shadow: 0 12px 36px #1f29371a;
    }

    h1 {
      margin-top: 0;
    }

    #click-button {
      border: 0;
      border-radius: 0.65rem;
      padding: 0.85rem 1.4rem;
      background: #356ae6;
      color: white;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    #click-button:hover {
      background: #2856c5;
    }

    #click-button:active {
      transform: scale(0.98);
    }

    #click-button.done,
    #click-button.done:hover {
      background: #198754;
    }

    #message {
      min-height: 1.5em;
      margin-bottom: 0;
      color: #198754;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <h1>Button Click Counter</h1>
    <p>Clicks: <span id="count">0</span> / 5</p>
    <button id="click-button" type="button">Click me</button>
    <p id="message" aria-live="polite"></p>
  </main>

  <script>
    const button = document.querySelector('#click-button');
    const countText = document.querySelector('#count');
    const message = document.querySelector('#message');
    let clicks = 0;

    button.addEventListener('click', () => {
      if (clicks >= 5) return;

      clicks += 1;
      countText.textContent = clicks;

      if (clicks === 5) {
        button.classList.add('done');
        message.textContent = 'Congratulations! You reached 5 clicks!';
      }
    });
  </script>
</body>
</html>
