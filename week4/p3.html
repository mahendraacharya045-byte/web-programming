<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-do List</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1rem;
      background: #f3f5f9;
      color: #202735;
      font-family: system-ui, sans-serif;
    }

    main {
      width: min(100%, 28rem);
      padding: 2rem;
      background: white;
      border-radius: 1rem;
      box-shadow: 0 12px 32px #2027351a;
    }

    h1 {
      margin-top: 0;
    }

    .add-row {
      display: flex;
      gap: 0.5rem;
    }

    input {
      min-width: 0;
      flex: 1;
      padding: 0.7rem 0.8rem;
      border: 1px solid #cbd2dc;
      border-radius: 0.5rem;
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 0.5rem;
      font: inherit;
      cursor: pointer;
    }

    #add-button {
      padding: 0.7rem 1rem;
      background: #356ae6;
      color: white;
      font-weight: 600;
    }

    ul {
      display: grid;
      gap: 0.6rem;
      margin: 1.25rem 0 0;
      padding: 0;
      list-style: none;
    }

    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.7rem 0.8rem;
      background: #f3f5f9;
      border-radius: 0.5rem;
      overflow-wrap: anywhere;
    }

    .delete-button {
      flex: 0 0 auto;
      width: 2rem;
      height: 2rem;
      background: #fee2e2;
      color: #b42318;
      font-size: 1rem;
    }

    .delete-button:hover {
      background: #fecaca;
    }
  </style>
</head>
<body>
  <main>
    <h1>To-do List</h1>

    <div class="add-row">
      <input id="todo-input" type="text" placeholder="What needs to be done?" aria-label="New to-do item">
      <button id="add-button" type="button">Add</button>
    </div>

    <ul id="todo-list" aria-label="To-do items"></ul>
  </main>

  <script>
    const input = document.querySelector('#todo-input');
    const addButton = document.querySelector('#add-button');
    const list = document.querySelector('#todo-list');

    function addItem() {
      const text = input.value.trim();
      if (!text) return;

      const item = document.createElement('li');
      const label = document.createElement('span');
      const deleteButton = document.createElement('button');

      label.textContent = text;
      deleteButton.type = 'button';
      deleteButton.className = 'delete-button';
      deleteButton.textContent = '✕';
      deleteButton.setAttribute('aria-label', `Delete ${text}`);

      item.append(label, deleteButton);
      list.append(item);

      input.value = '';
      input.focus();
    }

    addButton.addEventListener('click', addItem);

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        addItem();
      }
    });

    list.addEventListener('click', (e) => {
      if (e.target.matches('.delete-button')) {
        e.target.closest('li').remove();
      }
    });
  </script>
</body>
</html>
