<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f6fa">
  <title>My Products | Mahendra</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root { color-scheme: light; --ink:#192842; --muted:#78849a; --line:#e7ecf3; --blue:#4569dc; }
    * { box-sizing:border-box; }
    body {
      min-height:100vh; margin:0; padding:28px 22px 40px; color:var(--ink);
      background:radial-gradient(ellipse at 4% 18%,rgba(119,151,245,.12),transparent 28%),radial-gradient(ellipse at 96% 72%,rgba(127,199,174,.10),transparent 30%),#f4f6fa;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    button,input,a { font:inherit; }
    .container { width:min(100%,1120px); margin:0 auto; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:24px; }
    .brand { display:flex; align-items:center; gap:11px; font-size:14px; font-weight:800; }
    .brand-mark { display:grid; width:36px; height:36px; place-items:center; border-radius:12px; color:#fff; background:linear-gradient(145deg,#7795f3,#4569dc); box-shadow:0 6px 14px #4569dc38; font-size:17px; }
    .brand small { display:block; margin-top:2px; color:#8b96a9; font-size:10px; font-weight:600; letter-spacing:.04em; }
    .profile { display:flex; align-items:center; gap:11px; padding:7px 10px 7px 7px; border:1px solid #e4eaf2; border-radius:14px; background:#ffffffd9; }
    .profile-avatar { display:grid; width:35px; height:35px; place-items:center; border-radius:11px; color:#fff; background:#243b63; font-size:14px; font-weight:800; }
    .profile-name { font-size:12px; font-weight:750; }
    .profile-id { margin-top:3px; color:var(--muted); font-size:10px; }
    .profile-link { margin-left:5px; padding-left:12px; border-left:1px solid var(--line); color:var(--blue); text-decoration:none; font-size:11px; font-weight:700; }
    .profile-link:hover { text-decoration:underline; text-underline-offset:3px; }

    .hero { position:relative; display:flex; min-height:237px; align-items:center; justify-content:space-between; gap:28px; overflow:hidden; padding:42px 48px; border-radius:24px; color:white; background:linear-gradient(112deg,#192d50 0%,#233c68 58%,#33537f 100%); box-shadow:0 16px 35px #1b315326; }
    .hero::before,.hero::after { position:absolute; content:""; border:1px solid #ffffff17; border-radius:50%; pointer-events:none; }
    .hero::before { width:400px; height:400px; top:-235px; right:-28px; }
    .hero::after { width:300px; height:300px; top:-180px; right:22px; }
    .hero-copy { position:relative; z-index:1; max-width:610px; }
    .eyebrow { display:flex; align-items:center; gap:8px; margin-bottom:14px; color:#bdcbed; font-size:10px; font-weight:800; letter-spacing:.15em; text-transform:uppercase; }
    .eyebrow-dot { width:7px; height:7px; border-radius:50%; background:#83ddbd; box-shadow:0 0 0 4px #83ddbd22; }
    .hero h1 { margin:0; font-size:clamp(32px,4vw,44px); letter-spacing:-.05em; line-height:1.08; }
    .hero p { max-width:500px; margin:13px 0 0; color:#c1cce0; font-size:14px; line-height:1.65; }
    .hero-note { position:relative; z-index:1; flex:0 0 auto; width:168px; padding:17px; border:1px solid #ffffff29; border-radius:15px; background:#ffffff14; backdrop-filter:blur(8px); }
    .hero-note-label,.hero-note-caption { color:#c1cce0; font-size:10px; }
    .hero-note-number { margin:7px 0 3px; font-size:30px; font-weight:800; letter-spacing:-.05em; }
    .availability-dots { display:flex; gap:5px; margin-top:13px; }
    .availability-dots span { width:7px; height:7px; border-radius:50%; background:#82dcbb; }
    .availability-dots span.off { background:#f2a0a0; }

    .toolbar { position:relative; z-index:1; display:flex; align-items:center; justify-content:space-between; gap:15px; margin:-20px 28px 23px; padding:12px; border:1px solid #e7ecf3; border-radius:15px; background:white; box-shadow:0 8px 20px #2133500f; }
    .search-wrap { position:relative; flex:1; max-width:390px; }
    .search-icon { position:absolute; top:50%; left:13px; transform:translateY(-50%); color:#8b97aa; font-size:15px; pointer-events:none; }
    .search-input { width:100%; height:39px; padding:0 13px 0 37px; border:1px solid #e8edf4; border-radius:10px; outline:none; color:var(--ink); background:#fbfcfe; font-size:11px; }
    .search-input::placeholder { color:#9aa5b5; }
    .search-input:focus { border-color:#8ba3f1; box-shadow:0 0 0 3px #4569dc1a; }
    .filters { display:flex; align-items:center; gap:5px; padding:4px; border:1px solid #edf0f5; border-radius:10px; background:#f8f9fc; }
    .filter-btn { min-height:29px; padding:0 11px; border:0; border-radius:7px; color:#778399; background:transparent; font-size:10px; font-weight:700; cursor:pointer; }
    .filter-btn:hover { color:var(--ink); background:#eef1f7; }
    .filter-btn.active { color:white; background:#273e67; box-shadow:0 3px 7px #273e6729; }
    .toolbar-count { color:#8792a4; font-size:10px; white-space:nowrap; }
    .section-head { display:flex; align-items:flex-end; justify-content:space-between; gap:15px; margin:0 3px 15px; }
    .section-head h2 { margin:0; font-size:17px; letter-spacing:-.025em; }
    .section-head p { margin:5px 0 0; color:var(--muted); font-size:11px; }
    .product-list { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; }
    .product-card { overflow:hidden; border:1px solid #e6ebf2; border-radius:17px; background:white; box-shadow:0 7px 22px #2133500b; transition:transform .17s,border-color .17s,box-shadow .17s; }
    .product-card:hover { transform:translateY(-3px); border-color:#d6def0; box-shadow:0 13px 25px #21335017; }
    .product-visual { position:relative; display:grid; min-height:175px; place-items:center; overflow:hidden; background:var(--visual-bg); }
    .product-visual::before,.product-visual::after { position:absolute; content:""; border:1px solid #26385b12; border-radius:50%; }
    .product-visual::before { width:205px; height:205px; }
    .product-visual::after { width:150px; height:150px; }
    .product-symbol { position:relative; z-index:1; display:grid; width:98px; height:98px; place-items:center; border:1px solid #ffffffcc; border-radius:30px; color:var(--symbol-color); background:#ffffffa6; box-shadow:0 15px 28px #28375221,inset 0 1px 0 white; font-size:46px; transform:rotate(-5deg); }
    .product-tag { position:absolute; top:14px; left:14px; z-index:2; padding:6px 9px; border:1px solid #ffffffb3; border-radius:999px; color:#5d6c84; background:#ffffffbf; font-size:9px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; }
    .stock { position:absolute; right:13px; bottom:12px; z-index:2; display:inline-flex; align-items:center; gap:6px; padding:6px 9px; border:1px solid #ffffffcc; border-radius:999px; color:#176c50; background:#ffffffd1; font-size:9px; font-weight:800; }
    .stock::before { width:6px; height:6px; border-radius:50%; content:""; background:#2aa97b; }
    .stock.out { color:#a34d49; }
    .stock.out::before { background:#d36c66; }
    .product-info { padding:17px 18px 16px; }
    .product-info h3 { margin:0; font-size:14px; letter-spacing:-.02em; }
    .product-description { min-height:30px; margin:6px 0 12px; color:#8490a2; font-size:10px; line-height:1.5; }
    .rating-row { display:flex; align-items:center; gap:7px; }
    .stars { color:#eca93a; font-size:15px; letter-spacing:1px; line-height:1; }
    .star-half { color:transparent; background:linear-gradient(90deg,#eca93a 50%,#dce3ed 50%); background-clip:text; -webkit-background-clip:text; }
    .star-empty { color:#dce3ed; }
    .rating { color:#8290a4; font-size:9px; }
    .card-footer { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:14px; padding-top:13px; border-top:1px solid #edf0f5; }
    .price-label { display:block; margin-bottom:3px; color:#929daf; font-size:9px; }
    .price { color:#243858; font-size:20px; font-weight:800; letter-spacing:-.045em; }
    .price-currency { margin-left:3px; color:#65738a; font-size:11px; font-weight:700; }
    .availability-label { color:#8a95a7; font-size:9px; text-align:right; }
    .empty { grid-column:1/-1; padding:42px 20px; border:1px dashed #dfe5ee; border-radius:15px; color:#8994a5; background:#ffffffbf; font-size:12px; text-align:center; }
    .footer { margin-top:23px; color:#98a3b2; font-size:10px; text-align:center; }
    :focus-visible { outline:3px solid #92a9f7; outline-offset:3px; }
    @media (max-width:850px) {
      body { padding:22px 16px 32px; }
      .hero { padding:35px; }
      .product-list { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .toolbar { margin-right:16px; margin-left:16px; }
    }
    @media (max-width:600px) {
      .hero { min-height:0; padding:31px 26px; }
      .hero-note { width:135px; padding:13px; }
      .hero-note-number { font-size:25px; }
      .toolbar { align-items:stretch; flex-direction:column; margin:-16px 8px 21px; }
      .search-wrap { max-width:none; }
      .filters { justify-content:space-between; }
      .filter-btn { flex:1; }
      .section-head { margin-right:2px; margin-left:2px; }
    }
    @media (max-width:440px) {
      body { padding:17px 12px 26px; }
      .topbar { margin-bottom:16px; }
      .brand { font-size:12px; }
      .brand-mark { width:32px; height:32px; }
      .brand small { font-size:9px; }
      .profile { gap:8px; padding-right:8px; }
      .profile-avatar { width:31px; height:31px; }
      .profile-id { font-size:9px; }
      .profile-link { margin-left:1px; padding-left:8px; font-size:10px; }
      .hero { display:block; border-radius:19px; padding:28px 22px; }
      .hero h1 { font-size:34px; }
      .hero p { font-size:12px; }
      .hero-note { display:none; }
      .product-list { grid-template-columns:1fr; gap:13px; }
      .product-visual { min-height:160px; }
      .product-description { min-height:0; }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; transition-duration:.01ms!important; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const profile = {
      name: "Mahendra",
      id: "202537251",
      github: "https://github.com/mahendraacharya045-byte/web-programming/tree/main/week11-2"
    };

    const products = [
      { id:1, name:"Smart Watch", description:"Track activity and check everyday essentials at a glance.", price:149000, rating:4.7, inStock:true, category:"Wearables", symbol:"⌚", visualBg:"linear-gradient(145deg,#e2eaff,#cfdcff)", symbolColor:"#526daf" },
      { id:2, name:"Bluetooth Speaker", description:"Portable sound for your desk, room, or weekend trip.", price:69000, rating:4.5, inStock:true, category:"Audio", symbol:"♫", visualBg:"linear-gradient(145deg,#e0f3eb,#cce9dc)", symbolColor:"#398267" },
      { id:3, name:"Power Bank", description:"Extra battery power for your devices while on the go.", price:49000, rating:4.3, inStock:false, category:"Accessories", symbol:"▰", visualBg:"linear-gradient(145deg,#fff0d8,#ffe4bb)", symbolColor:"#ac7836" }
    ];

    function Stars({ rating }) {
      const full = Math.floor(rating);
      const half = rating - full >= 0.5;
      const empty = 5 - full - (half ? 1 : 0);
      return (
        <span className="stars" role="img" aria-label={`${rating} out of 5 stars`}>
          <span aria-hidden="true">{'★'.repeat(full)}</span>
          {half && <span className="star-half" aria-hidden="true">★</span>}
          {empty > 0 && <span className="star-empty" aria-hidden="true">{'★'.repeat(empty)}</span>}
        </span>
      );
    }

    function ProductCard({ product }) {
      return (
        <article className="product-card">
          <div className="product-visual" style={{ '--visual-bg': product.visualBg, '--symbol-color': product.symbolColor }}>
            <span className="product-tag">{product.category}</span>
            <span className="product-symbol" aria-hidden="true">{product.symbol}</span>
            <span className={`stock ${product.inStock ? '' : 'out'}`}>{product.inStock ? 'In stock' : 'Out of stock'}</span>
          </div>
          <div className="product-info">
            <h3>{product.name}</h3>
            <p className="product-description">{product.description}</p>
            <div className="rating-row"><Stars rating={product.rating} /><span className="rating">{product.rating.toFixed(1)} / 5</span></div>
            <div className="card-footer">
              <div><span className="price-label">Price</span><span className="price">{product.price.toLocaleString('ko-KR')}<span className="price-currency">원</span></span></div>
              <span className="availability-label">{product.inStock ? 'Available now' : 'Currently unavailable'}</span>
            </div>
          </div>
        </article>
      );
    }

    function App() {
      const [search, setSearch] = React.useState('');
      const [filter, setFilter] = React.useState('All');
      const availableCount = products.filter(product => product.inStock).length;
      const normalizedSearch = search.trim().toLowerCase();
      const filteredProducts = products.filter(product => {
        const matchesSearch = !normalizedSearch || product.name.toLowerCase().includes(normalizedSearch) || product.category.toLowerCase().includes(normalizedSearch);
        const matchesFilter = filter === 'All' || (filter === 'In stock' && product.inStock) || (filter === 'Sold out' && !product.inStock);
        return matchesSearch && matchesFilter;
      });

      return (
        <div className="container">
          <header className="topbar">
            <div className="brand"><span className="brand-mark" aria-hidden="true">✦</span><span>Good finds<small>PRODUCT COLLECTION</small></span></div>
            <div className="profile" aria-label={`Profile: ${profile.name}, ID ${profile.id}`}>
              <span className="profile-avatar" aria-hidden="true">M</span>
              <div><div className="profile-name">{profile.name}</div><div className="profile-id">ID {profile.id}</div></div>
              <a className="profile-link" href={profile.github} target="_blank" rel="noreferrer">GitHub ↗</a>
            </div>
          </header>

          <main>
            <section className="hero" aria-labelledby="page-title">
              <div className="hero-copy">
                <div className="eyebrow"><span className="eyebrow-dot" /> The everyday edit</div>
                <h1 id="page-title">My products</h1>
                <p>Explore a curated collection of useful tech essentials, with ratings and availability at a glance.</p>
              </div>
              <div className="hero-note" aria-label={`${availableCount} of ${products.length} products available`}>
                <div className="hero-note-label">Availability</div>
                <div className="hero-note-number">{availableCount}<span style={{ fontSize:16, color:'#c1cce0', fontWeight:600 }}> / {products.length}</span></div>
                <div className="hero-note-caption">products in stock</div>
                <div className="availability-dots" aria-hidden="true">{products.map(product => <span key={product.id} className={product.inStock ? '' : 'off'} />)}</div>
              </div>
            </section>

            <div className="toolbar">
              <label className="search-wrap"><span className="search-icon" aria-hidden="true">⌕</span><input className="search-input" type="search" placeholder="Search products or categories" value={search} onChange={event => setSearch(event.target.value)} aria-label="Search products or categories" /></label>
              <div className="filters" aria-label="Filter products by stock">
                {['All', 'In stock', 'Sold out'].map(item => <button key={item} type="button" className={`filter-btn ${filter === item ? 'active' : ''}`} aria-pressed={filter === item} onClick={() => setFilter(item)}>{item}</button>)}
              </div>
              <span className="toolbar-count" aria-live="polite">{filteredProducts.length} shown</span>
            </div>

            <section aria-labelledby="collection-title">
              <div className="section-head"><div><h2 id="collection-title">Featured collection</h2><p>Thoughtful picks for your everyday setup.</p></div></div>
              <div className="product-list" aria-live="polite">
                {filteredProducts.length === 0 ? <div className="empty">No products match your search. Try a different name or filter.</div> : filteredProducts.map(product => <ProductCard key={product.id} product={product} />)}
              </div>
            </section>
          </main>
          <footer className="footer">Product collection · {profile.name} · {profile.id}</footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
