
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile Fetch · Week 12</title>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 34px 18px; display: grid; place-items: center; background: radial-gradient(ellipse at 80% 0%, #fcebdc, transparent 31rem), #f9f5f0; color: #3e342b; font-family: 'DM Sans', Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; }
    #root { width: 100%; }
    .container { width: min(100% - 12px, 590px); margin: auto; padding: clamp(25px, 6vw, 42px); border: 1px solid #ece1d6; border-radius: 26px; background: rgba(255,255,255,.92); box-shadow: 0 24px 70px rgba(101,67,39,.11); }
    .eyebrow { color: #aa7546; font-size: 11px; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; }
    h1 { margin: 8px 0 5px; color: #44352a; font-size: clamp(31px, 6vw, 43px); letter-spacing: -.065em; }
    .intro { margin: 0; color: #8b7d70; line-height: 1.55; }
    .profile { position: relative; overflow: hidden; margin-top: 24px; padding: 28px; border: 1px solid #eedfcf; border-radius: 20px; background: linear-gradient(145deg, #fff8f0, #f9ede0); }
    .profile::before { content: 'U'; display: grid; width: 56px; height: 56px; margin-bottom: 20px; place-items: center; border: 1px solid rgba(255,255,255,.75); border-radius: 18px; background: linear-gradient(140deg, #e4ac71, #c67e4d); color: white; font-family: Georgia, serif; font-size: 28px; font-weight: 700; box-shadow: 0 8px 18px rgba(159,101,57,.2); }
    .profile h2 { margin: 0 0 13px; color: #49372a; font-size: 24px; letter-spacing: -.04em; }
    .profile p { margin: 8px 0; color: #776656; line-height: 1.55; overflow-wrap: anywhere; }
    .profile strong { color: #a66b3d; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    .loading { padding: 32px 0; color: #a66b3d; font-size: 15px; text-align: center; }
    .loading::before { content: ''; display: block; width: 28px; height: 28px; margin: 0 auto 12px; border: 3px solid #f0e0d0; border-top-color: #c67e4d; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { margin-top: 20px; padding: 14px; border: 1px solid #f2c9bd; border-radius: 11px; background: #fff1ec; color: #a34531; }
    .credit { display: flex; justify-content: center; flex-wrap: wrap; gap: 7px 12px; padding: 18px 5px 0; color: #928579; font-size: 11px; }
    .credit a { color: #a66b3d; font-weight: 750; text-decoration: none; }
    .credit a:hover { text-decoration: underline; }
    @media (max-width: 480px) { body { padding: 22px 12px; } .container { border-radius: 22px; } .profile { padding: 22px; } }
  </style>
</head>

<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function UserProfile() {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);

      useEffect(() => {
        async function fetchUser() {
          try {
            const res = await fetch(
              'https://jsonplaceholder.typicode.com/users/1'
            );

            if (!res.ok) {
              throw new Error('Failed to fetch user data');
            }

            const data = await res.json();
            setUser(data);

          } catch (err) {
            setError(err.message);

          } finally {
            setLoading(false);
          }
        }

        fetchUser();
      }, []);

      if (loading) {
        return (
          <p className="loading">Loading...</p>
        );
      }

      if (error) {
        return (
          <div className="error">
            <p>Error: {error}</p>
          </div>
        );
      }

      return (
        <div className="profile">
          <h2>{user.name}</h2>
          <p><strong>Email:</strong> {user.email}</p>
        </div>
      );
    }

    function App() {
      return (
        <div className="container">
          <div className="eyebrow">React · Data fetching</div>
          <h1>User Profile</h1>
          <p className="intro">Fetching sample profile information from JSONPlaceholder.</p>

          <UserProfile />
          <footer className="credit">
            <span>Mahendra Acharya · 202537251</span>
            <a href="https://github.com/mahendraacharya045-byte/web-programming/tree/main/week11-2" target="_blank" rel="noreferrer">GitHub ↗</a>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(
      document.getElementById('root')
    );

    root.render(<App />);
  </script>

</body>
</html>
