
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>React Stopwatch · Week 12</title>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 34px 18px; display: grid; place-items: center; background: radial-gradient(ellipse at 15% 0%, #d8f2ec, transparent 32rem), #f0f7f5; color: #173d3c; font-family: 'DM Sans', Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; }
    #root { width: 100%; }
    .container { width: min(100% - 12px, 570px); margin: auto; padding: clamp(25px, 7vw, 47px); border: 1px solid #d9e8e3; border-radius: 27px; background: rgba(255,255,255,.91); box-shadow: 0 24px 70px rgba(21,73,65,.12); text-align: center; }
    .eyebrow { color: #358276; font-size: 11px; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; }
    h1 { margin: 8px 0 5px; color: #173f46; font-size: clamp(30px, 6vw, 43px); letter-spacing: -.065em; }
    .status { display: inline-flex; align-items: center; gap: 8px; margin: 12px 0 4px; padding: 7px 11px; border-radius: 99px; background: #edf3f0; color: #728780; font-size: 12px; }
    .status::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #9aaea6; }
    .status.running { background: #e6f5eb; color: #28774a; }
    .status.running::before { background: #33a75f; box-shadow: 0 0 0 4px rgba(51,167,95,.12); }
    .timer { margin: 27px 0 20px; padding: 25px 10px; border: 1px solid #e2ece7; border-radius: 20px; background: linear-gradient(145deg, #f8fbf8, #eaf5ef); color: #174b4d; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: clamp(66px, 16vw, 100px); font-weight: 750; font-variant-numeric: tabular-nums; letter-spacing: -.09em; line-height: 1; }
    .timer::after { content: 'SECONDS'; display: block; margin-top: 12px; color: #8ba29a; font-family: 'DM Sans', Inter, sans-serif; font-size: 10px; font-weight: 800; letter-spacing: .18em; }
    .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; }
    button { min-width: 100px; padding: 12px 18px; border: 0; border-radius: 11px; color: white; font: inherit; font-size: 14px; font-weight: 750; cursor: pointer; transition: transform .18s ease, opacity .18s ease; }
    button:hover:not(:disabled) { transform: translateY(-2px); }
    .start { background: #25844f; }
    .stop { background: #d45a4c; }
    .reset { background: #174b4d; }
    button:disabled { opacity: .4; cursor: not-allowed; }
    .elapsed { margin: 18px 0 0; color: #82968e; font-size: 13px; }
    .credit { display: flex; justify-content: center; flex-wrap: wrap; gap: 7px 12px; padding: 18px 5px 0; color: #82958e; font-size: 11px; }
    .credit a { color: #397c6e; font-weight: 750; text-decoration: none; }
    .credit a:hover { text-decoration: underline; }
    @media (max-width: 480px) { body { padding: 22px 12px; } .container { border-radius: 22px; } button { flex: 1; min-width: 0; } }
  </style>
</head>

<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function Stopwatch() {
      const [seconds, setSeconds] = useState(0);
      const [running, setRunning] = useState(false);

      useEffect(() => {
        if (!running) return;

        const id = setInterval(() => {
          setSeconds(s => s + 1);
        }, 1000);

        return () => {
          clearInterval(id);
        };
      }, [running]);

      function handleStart() {
        setRunning(true);
      }

      function handleStop() {
        setRunning(false);
      }

      function handleReset() {
        setRunning(false);
        setSeconds(0);
      }

      return (
        <div className="container">
          <div className="eyebrow">React · Effects &amp; timers</div>
          <h1>React Stopwatch</h1>

          <p className={running ? 'status running' : 'status'}>
            {running ? 'Stopwatch is running...' : 'Stopwatch is stopped'}
          </p>

          <div className="timer">
            {seconds}s
          </div>

          <div className="actions">
            <button className="start" onClick={handleStart} disabled={running}>Start</button>
            <button className="stop" onClick={handleStop} disabled={!running}>Stop</button>
            <button className="reset" onClick={handleReset}>Reset</button>
          </div>

          <p className="elapsed">Total elapsed time: <strong>{seconds} seconds</strong></p>
        </div>
      );
    }

    function App() {
      return (
        <div className="page">
          <Stopwatch />
          <footer className="credit">
            <span>Mahendra Acharya · 202537251</span>
            <a href="https://github.com/mahendraacharya045-byte/web-programming/tree/main/week11-2" target="_blank" rel="noreferrer">GitHub ↗</a>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(
      document.getElementById('root')
    );

    root.render(<App />);
  </script>

</body>
</html>
