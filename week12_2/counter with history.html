<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#173f46">
  <title>Counter with History · Week 12</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 36px 18px;
      display: grid;
      place-items: center;
      color: #183b3a;
      background: radial-gradient(ellipse at 16% 5%, #dff1db, transparent 32rem), #f1f7f4;
      font-family: 'DM Sans', Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    .shell { width: min(100%, 620px); }
    .brand { display: flex; align-items: center; gap: 9px; margin: 0 0 17px 4px; color: #66817a; font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .brand-mark { display: grid; width: 28px; height: 28px; place-items: center; border-radius: 9px; background: #cde99e; color: #25564a; font-size: 17px; }
    .card { padding: clamp(25px, 7vw, 46px); border: 1px solid #d8e6df; border-radius: 27px; background: rgba(255,255,255,.88); box-shadow: 0 24px 70px rgba(28, 73, 61, .12); }
    .eyebrow { color: #498476; font-size: 11px; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; }
    h1 { margin: 8px 0 5px; color: #163e42; font-size: clamp(28px, 6vw, 40px); letter-spacing: -.06em; line-height: 1.1; }
    .intro { margin: 0; color: #72867f; line-height: 1.55; }
    .counter-display { margin: 30px 0 23px; padding: 22px; border: 1px solid #e0ebe5; border-radius: 20px; background: linear-gradient(145deg, #f7fbf6, #ebf5ed); text-align: center; }
    .counter-label { color: #72867f; font-size: 12px; font-weight: 750; letter-spacing: .1em; text-transform: uppercase; }
    #count { display: block; margin-top: 5px; color: #174b4d; font-size: clamp(76px, 18vw, 112px); font-variant-numeric: tabular-nums; font-weight: 800; letter-spacing: -.09em; line-height: 1.1; }
    .controls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    button { min-height: 48px; border: 1px solid #dbe7e0; border-radius: 12px; background: #fff; color: #315e55; font: inherit; font-size: 14px; font-weight: 750; cursor: pointer; transition: transform .18s ease, box-shadow .18s ease, background .18s ease; }
    button:hover { transform: translateY(-2px); background: #f1f8ee; box-shadow: 0 8px 16px rgba(28,73,61,.08); }
    button.primary { border-color: #174b4d; background: #174b4d; color: #fff; }
    button.primary:hover { background: #22655f; }
    .history { margin-top: 24px; padding-top: 20px; border-top: 1px solid #e3ece7; }
    .history-heading { display: flex; justify-content: space-between; align-items: center; gap: 10px; color: #244c48; font-size: 14px; font-weight: 750; }
    .history-tag { padding: 5px 9px; border-radius: 99px; background: #eaf3e6; color: #66817a; font-size: 11px; font-weight: 700; }
    #history { overflow-wrap: anywhere; margin: 11px 0 0; padding: 12px 14px; border-radius: 11px; background: #f5f8f5; color: #6a8279; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; line-height: 1.7; }
    .credit { display: flex; justify-content: center; flex-wrap: wrap; gap: 7px 12px; padding: 18px 8px 0; color: #82958e; font-size: 11px; }
    .credit a { color: #397c6e; font-weight: 750; text-decoration: none; }
    .credit a:hover { text-decoration: underline; }
    @media (max-width: 480px) { body { padding: 22px 13px; } .controls { grid-template-columns: repeat(2, 1fr); } .card { border-radius: 22px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand"><span class="brand-mark">↗</span> Web Programming · Week 12</div>
    <section class="card" aria-labelledby="page-title">
      <div class="eyebrow">State &amp; history</div>
      <h1 id="page-title">Counter with History</h1>
      <p class="intro">Change the count and step back through your latest values.</p>
      <div class="counter-display">
        <div class="counter-label">Current value</div>
        <span id="count" aria-live="polite">0</span>
      </div>
      <div class="controls" aria-label="Counter controls">
        <button class="primary" type="button" onclick="increase()">+1&nbsp; Increase</button>
        <button type="button" onclick="decrease()">−1&nbsp; Decrease</button>
        <button type="button" onclick="reset()">Reset</button>
        <button type="button" onclick="undo()">Undo</button>
      </div>
      <section class="history" aria-labelledby="history-title">
        <div class="history-heading"><span id="history-title">Recent values</span><span class="history-tag">Last 5 changes</span></div>
        <p id="history" aria-live="polite">0</p>
      </section>
    </section>
    <footer class="credit"><span>Mahendra Acharya · 202537251</span><a href="https://github.com/mahendraacharya045-byte/web-programming/tree/main/week11-2" target="_blank" rel="noreferrer">GitHub ↗</a></footer>
  </main>
  <script>
    let count = 0;
    let history = [0];

    function updateHistory() {
      document.getElementById("count").textContent = count;
      document.getElementById("history").textContent = history.join(", ");
    }

    function increase() {
      count++;
      history.push(count);
      history = history.slice(-5);
      updateHistory();
    }

    function decrease() {
      count--;
      history.push(count);
      history = history.slice(-5);
      updateHistory();
    }

    function reset() {
      count = 0;
      history.push(count);
      history = history.slice(-5);
      updateHistory();
    }

    function undo() {
      if (history.length > 1) {
        history.pop();
        count = history[history.length - 1];
        updateHistory();
      }
    }
  </script>
</body>
</html>
