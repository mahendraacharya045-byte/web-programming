
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiplayer Scoreboard</title>

  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="vendor/babel.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 15px;
      font-family: Arial, sans-serif;
      background: #eef2ff;
      color: #1e293b;
    }

    .dashboard {
      max-width: 750px;
      margin: 25px auto;
      padding: 30px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.08);
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      margin: 0 0 8px;
      color: #1e3a8a;
    }

    .header p {
      color: #64748b;
    }

    .total-box {
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: white;
      padding: 25px;
      border-radius: 16px;
      text-align: center;
      margin-bottom: 25px;
    }

    .total-box h2 {
      font-size: 42px;
      margin: 10px 0;
    }

    .total-box p {
      margin: 0;
      opacity: 0.85;
    }

    .players {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .player-card {
      padding: 22px;
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 15px;
      text-align: center;
      transition: 0.2s;
    }

    .player-card.winner {
      border-color: #eab308;
      background: #fefce8;
    }

    .avatar {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .player-card h3 {
      margin: 5px 0;
      color: #334155;
    }

    .score {
      font-size: 48px;
      font-weight: bold;
      color: #2563eb;
      margin: 20px 0;
    }

    .winner .score {
      color: #ca8a04;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 12px 20px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      opacity: 0.85;
    }

    .minus {
      background: #fee2e2;
      color: #dc2626;
    }

    .plus {
      background: #dcfce7;
      color: #15803d;
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none;
    }

    .winner-label {
      display: inline-block;
      background: #fef3c7;
      color: #92400e;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-top: 12px;
    }

    .game-info {
      margin-top: 25px;
      padding: 20px;
      background: #f1f5f9;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .game-info p {
      margin: 5px 0;
      color: #475569;
    }

    .reset {
      background: #1e293b;
      color: white;
      font-size: 14px;
    }

    .history {
      margin-top: 25px;
    }

    .history h3 {
      color: #334155;
    }

    .history p {
      padding: 10px;
      background: #f8fafc;
      border-radius: 8px;
      color: #64748b;
      font-size: 13px;
    }

    @media (max-width: 500px) {
      .players {
        grid-template-columns: 1fr;
      }

      .dashboard {
        padding: 20px;
      }
    }

    :root { --navy:#1d3558; --blue:#4d70e3; }
    body { min-height:100vh; padding:0; color:#192842; background:#f3f6fb; font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    .site-header { display:flex; align-items:center; justify-content:space-between; gap:18px; min-height:64px; padding:10px max(18px,calc((100vw - 1120px)/2)); border-bottom:1px solid #e6ebf2; background:rgba(255,255,255,.95); }
    .brand { display:flex; align-items:center; gap:9px; color:#20385c; font-size:11px; font-weight:850; letter-spacing:.09em; }
    .brand-mark,.profile-avatar { display:grid; place-items:center; width:32px; height:32px; border-radius:10px; color:#fff; background:linear-gradient(145deg,#7e9bfa,#4d70e3); font-weight:800; }
    .profile-chip { display:flex; align-items:center; gap:9px; }
    .profile-avatar { background:#233d64; }
    .profile-copy { font-size:10px; font-weight:750; }
    .profile-copy small { display:block; margin-top:2px; color:#8290a3; font-size:8px; font-weight:500; }
    .profile-link { margin-left:5px; color:#4d70e3; font-size:9px; font-weight:750; text-decoration:none; }
    .profile-link:hover { text-decoration:underline; text-underline-offset:3px; }
    .dashboard {
      display:grid;
      grid-template-columns:minmax(0,1.25fr) minmax(280px,.75fr);
      grid-template-areas:"head head" "total total" "players info" "players history" "reset history";
      gap:16px;
      max-width:1120px;
      margin:28px auto;
      padding:0 20px;
      background:transparent;
      border-radius:0;
      box-shadow:none;
    }
    .dashboard > .header { grid-area:head; display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin:0 2px 3px; text-align:left; }
    .header h1 { margin:0; color:#203654; font-size:28px; letter-spacing:-.04em; }
    .header p { margin-top:6px; color:#78849a; font-size:11px; }
    .total-box { grid-area:total; display:flex; align-items:center; justify-content:space-between; gap:20px; margin:0; padding:19px 24px; border-radius:15px; text-align:left; background:linear-gradient(110deg,#20375c,#3c61a1); box-shadow:0 11px 24px rgba(44,75,127,.16); }
    .total-box h2 { margin:0; color:#fff; font-size:38px; letter-spacing:-.05em; }
    .total-box p { margin:0; color:#d2def1; font-size:9px; }
    .players { grid-area:players; grid-template-columns:1fr; gap:11px; }
    .player-card { display:grid; grid-template-columns:54px 1fr auto; grid-template-rows:auto auto; align-items:center; column-gap:12px; padding:15px 17px; border:1px solid #e5ebf3; border-radius:13px; background:white; text-align:left; }
    .player-card.winner { border-color:#e8d79d; background:#fffdf6; }
    .avatar { grid-column:1; grid-row:1 / span 2; display:grid; width:50px; height:50px; place-items:center; margin:0; border-radius:15px; background:#edf2ff; font-size:28px; }
    .player-card h3 { grid-column:2; grid-row:1; margin:0; color:#53627a; font-size:11px; }
    .score { grid-column:3; grid-row:1 / span 2; margin:0 5px 0 0; color:#4569dc; font-size:42px; letter-spacing:-.06em; }
    .winner .score { color:#bd8a29; }
    .buttons { grid-column:2; grid-row:2; justify-content:flex-start; gap:6px; margin-top:7px; }
    button { padding:8px 13px; border-radius:8px; font-size:11px; transition:transform .15s,background .15s; }
    button:hover:not(:disabled) { transform:translateY(-1px); }
    .minus { color:#ac4d49; background:#fff0ed; }
    .minus:hover:not(:disabled) { background:#ffe3df; }
    .plus { color:#167551; background:#eaf8f1; }
    .plus:hover:not(:disabled) { background:#d9f1e5; }
    .winner-label { grid-column:2; grid-row:3; justify-self:start; margin-top:6px; padding:4px 8px; color:#8c641f; background:#fff4d6; font-size:8px; }
    .game-info { grid-area:info; display:block; margin:0; padding:17px; border:1px solid #e5ebf3; border-radius:13px; background:white; }
    .game-info p { margin:0 0 8px; color:#65738a; font-size:10px; }
    .game-info strong { color:#2d4263; }
    .game-info .plus { margin-top:6px; color:#fff; background:#4569dc; }
    .history { grid-area:history; align-self:start; margin:0; padding:17px; border:1px solid #e5ebf3; border-radius:13px; background:white; }
    .history h3 { margin:0 0 10px; color:#2d4263; font-size:12px; }
    .history p { margin:0 0 6px; padding:9px 10px; color:#718097; background:#f7f9fc; font-size:9px; }
    .dashboard > div[style*="text-align"] { grid-area:reset; margin:0!important; text-align:left!important; }
    .reset { color:#728098; background:#f0f3f8; font-size:10px; }
    @media(max-width:700px) {
      .dashboard { grid-template-columns:1fr; grid-template-areas:"head" "total" "players" "info" "history" "reset"; margin:18px auto; padding:0 14px; }
      .players { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .player-card { display:flex; flex-direction:column; align-items:center; text-align:center; }
      .avatar { margin-bottom:7px; }
      .score { margin:9px 0; }
      .buttons { justify-content:center; flex-wrap:wrap; }
      .winner-label { align-self:center; }
    }
    @media(max-width:450px) { .site-header { padding:9px 12px; } .dashboard > .header { display:block; } .header h1 { font-size:23px; } .players { grid-template-columns:1fr; } .total-box { padding:15px; } }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function PlayerScore({
      name,
      avatar,
      score,
      isWinner,
      onIncrement,
      onDecrement
    }) {
      return (
        <div className={`player-card ${isWinner ? "winner" : ""}`}>

          <div className="avatar">{avatar}</div>

          <h3>{name}</h3>

          <div className="score">{score}</div>

          <div className="buttons">
            <button
              className="minus"
              onClick={onDecrement}
              disabled={score === 0}
            >
              −
            </button>

            <button className="plus" onClick={onIncrement}>
              +
            </button>
          </div>

          {isWinner && (
            <div className="winner-label">
              🏆 LEADING PLAYER
            </div>
          )}

        </div>
      );
    }

    function ScoreBoard() {
      const [p1, setP1] = useState(0);
      const [p2, setP2] = useState(0);
      const [round, setRound] = useState(1);
      const [history, setHistory] = useState([]);

      const total = p1 + p2;

      function updateScore(player, amount) {
        if (player === 1) {
          setP1(prev => Math.max(0, prev + amount));
        } else {
          setP2(prev => Math.max(0, prev + amount));
        }

        setHistory(prev => [
          `${player === 1 ? "Player 1" : "Player 2"} ${
            amount > 0 ? "gained" : "lost"
          } ${Math.abs(amount)} point(s)`,
          ...prev
        ].slice(0, 5));
      }

      function nextRound() {
        setRound(prev => prev + 1);
      }

      function resetGame() {
        setP1(0);
        setP2(0);
        setRound(1);
        setHistory([]);
      }

      const leader = p1 > p2
        ? "Player 1"
        : p2 > p1
        ? "Player 2"
        : "Tie Game";

      return (
        <div className="dashboard">

          <div className="header">
            <h1>🏆 Scoreboard</h1>
            <p>Two players. One competition. Keep scoring!</p>
          </div>

          <div className="total-box">
            <p>TOTAL COMBINED SCORE</p>
            <h2>{total}</h2>
            <p>Round {round} · {leader}</p>
          </div>

          <div className="players">

            <PlayerScore
              name="Player 1"
              avatar="🧑‍💻"
              score={p1}
              isWinner={p1 > p2}
              onIncrement={() => updateScore(1, 1)}
              onDecrement={() => updateScore(1, -1)}
            />

            <PlayerScore
              name="Player 2"
              avatar="🎮"
              score={p2}
              isWinner={p2 > p1}
              onIncrement={() => updateScore(2, 1)}
              onDecrement={() => updateScore(2, -1)}
            />

          </div>

          <div className="game-info">
            <div>
              <p><strong>Current Leader:</strong> {leader}</p>
              <p><strong>Current Round:</strong> {round}</p>
            </div>

            <button className="plus" onClick={nextRound}>
              Next Round →
            </button>
          </div>

          <div className="history">
            <h3>Recent Score Activity</h3>

            {history.length === 0 ? (
              <p>No activity yet. Start scoring!</p>
            ) : (
              history.map((item, index) => (
                <p key={index}>• {item}</p>
              ))
            )}
          </div>

          <div style={{ textAlign: "center", marginTop: "25px" }}>
            <button className="reset" onClick={resetGame}>
              ↻ Reset Game
            </button>
          </div>

        </div>
      );
    }

    function App() {
      return (
        <>
          <header className="site-header">
            <div className="brand"><span className="brand-mark">✦</span> WEEK 12 · SCOREBOARD</div>
            <div className="profile-chip"><span className="profile-avatar">M</span><div className="profile-copy">Mahendra<small>ID 202537251</small></div><a className="profile-link" href="https://github.com/mahendraacharya045-byte/web-programming/tree/main/week11-2" target="_blank" rel="noreferrer">GitHub ↗</a></div>
          </header>
          <ScoreBoard />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
