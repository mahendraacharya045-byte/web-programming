<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Latest Posts</title>
  <style>
    body {
      font: 16px/1.5 system-ui, sans-serif;
      max-width: 700px;
      margin: 10vh auto;
      padding: 24px;
      color: #172033;
      background: #f4f6fb;
    }

    main {
      padding: 28px;
      background: white;
      border: 1px solid #dce2ef;
      border-radius: 12px;
    }

    li {
      margin: 12px 0;
    }

    button {
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      color: white;
      background: #3157c8;
      font: inherit;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #status {
      min-height: 1.5em;
      color: #5b6475;
    }
  </style>
</head>
<body>
  <main>
    <h1>Posts</h1>
    <p id="status" aria-live="polite">Loading posts…</p>
    <ol id="posts"></ol>
    <button id="loadButton" type="button">Load posts</button>
  </main>

  <script>
    const postsElement = document.querySelector("#posts");
    const statusElement = document.querySelector("#status");
    const loadButton = document.querySelector("#loadButton");

    async function getPosts() {
      loadButton.disabled = true;
      statusElement.textContent = "Loading posts…";
      postsElement.replaceChildren();

      try {
        const response = await fetch(
          "https://jsonplaceholder.typicode.com/posts"
        );

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const posts = await response.json();

        posts.slice(0, 5).forEach(post => {
          const item = document.createElement("li");
          item.textContent = `#${post.id}: ${post.title}`;
          postsElement.appendChild(item);
        });

        statusElement.textContent = "";
      } catch (error) {
        statusElement.textContent = `Failed to load posts: ${error.message}`;
      } finally {
        loadButton.disabled = false;
      }
    }

    loadButton.addEventListener("click", getPosts);
    getPosts();
  </script>
</body>
</html>
