<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Random Joke</title>
  <style>
    body {
      font: 16px/1.5 system-ui, sans-serif;
      max-width: 600px;
      margin: 10vh auto;
      padding: 24px;
      color: #172033;
      background: #f4f6fb;
    }

    main {
      padding: 28px;
      background: white;
      border: 1px solid #dce2ef;
      border-radius: 12px;
    }

    button {
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      color: white;
      background: #3157c8;
      font: inherit;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #status {
      min-height: 1.5em;
      color: #5b6475;
    }
  </style>
</head>
<body>
  <main>
    <h1>Random Joke</h1>
    <p id="setup">Loading a joke…</p>
    <p id="punchline"></p>
    <p id="status" aria-live="polite"></p>
    <button id="jokeButton" type="button">Get another joke</button>
  </main>

  <script>
    const setupElement = document.querySelector("#setup");
    const punchlineElement = document.querySelector("#punchline");
    const statusElement = document.querySelector("#status");
    const jokeButton = document.querySelector("#jokeButton");

    async function getJoke() {
      jokeButton.disabled = true;
      statusElement.textContent = "Loading…";

      try {
        const response = await fetch(
          "https://official-joke-api.appspot.com/random_joke"
        );

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const joke = await response.json();

        if (!joke.setup || !joke.punchline) {
          throw new Error("The API returned an unexpected response.");
        }

        setupElement.textContent = joke.setup;
        punchlineElement.textContent = joke.punchline;
        statusElement.textContent = "";
      } catch (error) {
        setupElement.textContent = "Could not load a joke.";
        punchlineElement.textContent = "";
        statusElement.textContent = `Failed: ${error.message}`;
      } finally {
        jokeButton.disabled = false;
      }
    }

    jokeButton.addEventListener("click", getJoke);
    getJoke();
  </script>
</body>
</html>
