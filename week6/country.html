<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Country Lookup</title>
  <style>
    body {
      font: 16px/1.5 system-ui, sans-serif;
      max-width: 700px;
      margin: 8vh auto;
      padding: 24px;
      color: #172033;
      background: #f4f6fb;
    }

    main {
      padding: 28px;
      background: white;
      border: 1px solid #dce2ef;
      border-radius: 12px;
    }

    form {
      display: flex;
      gap: 8px;
    }

    input, button {
      padding: 10px 12px;
      border-radius: 8px;
      font: inherit;
    }

    input {
      flex: 1;
      min-width: 0;
      border: 1px solid #b8c2d6;
    }

    button {
      border: 0;
      color: white;
      background: #3157c8;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #status {
      min-height: 1.5em;
      color: #5b6475;
    }

    .country {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 16px;
      padding: 16px;
      border: 1px solid #dce2ef;
      border-radius: 10px;
    }

    .country img {
      width: 120px;
      max-height: 80px;
      object-fit: contain;
    }

    .country h2, .country p {
      margin: 4px 0;
    }
  </style>
</head>
<body>
  <main>
    <h1>Country Lookup</h1>

    <form id="countryForm">
      <input
        id="countryName"
        type="text"
        value="korea"
        aria-label="Country name"
        required
      >
      <button id="searchButton" type="submit">Search</button>
    </form>

    <p id="status" aria-live="polite">Loading countries…</p>
    <section id="results" aria-label="Country search results"></section>
  </main>

  <script>
    const form = document.querySelector("#countryForm");
    const countryNameInput = document.querySelector("#countryName");
    const searchButton = document.querySelector("#searchButton");
    const statusElement = document.querySelector("#status");
    const resultsElement = document.querySelector("#results");

    async function getCountry(name = "korea") {
      searchButton.disabled = true;
      statusElement.textContent = "Loading countries…";
      resultsElement.replaceChildren();

      try {
        const query = name.trim();

        if (!query) {
          throw new Error("Enter a country name.");
        }

        const url = `https://countries.dev/name/${encodeURIComponent(query)}`;
        const response = await fetch(url);

        if (!response.ok) {
          if (response.status === 404) {
            throw new Error("No matching countries found.");
          }
          throw new Error(`HTTP ${response.status}`);
        }

        const countries = await response.json();

        if (!Array.isArray(countries) || countries.length === 0) {
          throw new Error("No matching countries found.");
        }

        countries.forEach(country => {
          const card = document.createElement("article");
          card.className = "country";

          if (country.flags?.png) {
            const flag = document.createElement("img");
            flag.src = country.flags.png;
            flag.alt = `${country.name} flag`;
            card.appendChild(flag);
          }

          const details = document.createElement("div");

          const heading = document.createElement("h2");
          heading.textContent = country.name;
          details.appendChild(heading);

          const capital = document.createElement("p");
          capital.textContent = `Capital: ${country.capital || "N/A"}`;
          details.appendChild(capital);

          const population = document.createElement("p");
          population.textContent =
            `Population: ${
              typeof country.population === "number"
                ? country.population.toLocaleString()
                : "N/A"
            }`;
          details.appendChild(population);

          card.appendChild(details);
          resultsElement.appendChild(card);
        });

        statusElement.textContent =
          `Found ${countries.length} matching ${
            countries.length === 1 ? "country" : "countries"
          }.`;
      } catch (error) {
        statusElement.textContent = `Failed: ${error.message}`;
      } finally {
        searchButton.disabled = false;
      }
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      getCountry(countryNameInput.value);
    });

    getCountry();
  </script>
</body>
</html>
