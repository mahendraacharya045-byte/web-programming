<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mahendra Acharya | React Portfolio</title>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

  <style>
    :root {
      --bg: #070b17;
      --panel: rgba(18, 26, 45, .78);
      --panel-solid: #121a2d;
      --panel-2: #172238;
      --text: #eef3ff;
      --muted: #a7b4d2;
      --line: rgba(143, 168, 255, .18);
      --mint: #5ce1c6;
      --indigo: #8fa8ff;
      --pink: #ff8fb8;
      --amber: #f6c76b;
      --shadow: 0 24px 60px rgba(3, 8, 22, .45);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.65;
      background:
        radial-gradient(circle at 8% 5%, rgba(92,225,198,.16), transparent 32rem),
        radial-gradient(circle at 92% 8%, rgba(143,168,255,.18), transparent 30rem),
        radial-gradient(circle at 70% 90%, rgba(255,143,184,.10), transparent 30rem),
        var(--bg);
    }

    h1, h2, h3, h4 {
      margin: 0;
      font-family: ui-serif, "Iowan Old Style", Georgia, serif;
      line-height: 1.15;
      letter-spacing: -.02em;
    }

    a {
      color: var(--indigo);
      text-decoration: none;
    }

    a:hover { color: var(--mint); }

    a:focus-visible,
    button:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(143,168,255,.65);
      outline-offset: 3px;
      border-radius: 8px;
    }

    .page {
      width: min(1180px, calc(100% - 36px));
      margin: 0 auto;
      padding: 34px 0 80px;
    }

    /* Navigation */
    .nav {
      position: sticky;
      top: 16px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(10, 16, 31, .72);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 14px;
      color: #07131c;
      font-family: ui-serif, Georgia, serif;
      font-weight: 800;
      background: linear-gradient(135deg, var(--mint), var(--indigo));
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .nav-link {
      padding: 9px 14px;
      border-radius: 999px;
      color: var(--muted);
      font-size: .94rem;
      transition: color .2s ease, background .2s ease;
    }

    .nav-link:hover {
      color: var(--text);
      background: rgba(143,168,255,.12);
    }

    .nav-cta {
      padding: 10px 18px;
      border: 1px solid transparent;
      border-radius: 999px;
      color: #07131c;
      font-weight: 700;
      background: linear-gradient(120deg, var(--mint), var(--indigo));
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .nav-cta:hover {
      color: #07131c;
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(92,225,198,.22);
    }

    /* Hero */
    .hero {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 34px;
      align-items: center;
      margin-top: 34px;
      padding: clamp(28px, 5vw, 56px);
      border: 1px solid var(--line);
      border-radius: 34px;
      background: linear-gradient(145deg, rgba(23,34,56,.94), rgba(18,26,45,.75));
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
    }

    .hero::after {
      content: "";
      position: absolute;
      right: -90px;
      bottom: -110px;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(92,225,198,.18), transparent 65%);
      pointer-events: none;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      margin-bottom: 20px;
      border: 1px solid rgba(92,225,198,.35);
      border-radius: 999px;
      color: var(--mint);
      font-size: .86rem;
      font-weight: 600;
      background: rgba(92,225,198,.10);
    }

    .hero h1 {
      font-size: clamp(2.4rem, 5.5vw, 4.2rem);
      margin-bottom: 18px;
    }

    .gradient-text {
      background: linear-gradient(100deg, var(--mint), var(--indigo), var(--pink));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero p {
      max-width: 560px;
      margin: 0;
      color: var(--muted);
      font-size: 1.06rem;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 22px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-weight: 650;
      transition: transform .2s ease, border-color .2s ease, background .2s ease;
    }

    .btn-primary {
      color: #07131c;
      border-color: transparent;
      background: linear-gradient(120deg, var(--mint), var(--indigo));
    }

    .btn-ghost {
      color: var(--text);
      background: rgba(143,168,255,.08);
    }

    .btn:hover {
      transform: translateY(-3px);
      border-color: rgba(143,168,255,.45);
    }

    .hero-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 34px;
    }

    .stat {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(7, 11, 23, .45);
    }

    .stat strong {
      display: block;
      font-size: 1.45rem;
      font-family: ui-serif, Georgia, serif;
    }

    .stat span {
      color: var(--muted);
      font-size: .84rem;
    }

    .hero-visual {
      position: relative;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: rgba(7,11,23,.55);
      backdrop-filter: blur(10px);
    }

    .code-window {
      padding: 18px;
      border-radius: 20px;
      background: #05080f;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: .82rem;
      color: #c9d7ff;
      overflow: hidden;
    }

    .code-title {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: .78rem;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .code-window pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .keyword { color: var(--pink); }
    .component { color: var(--mint); }
    .prop { color: var(--amber); }

    /* Section */
    .section {
      margin-top: 64px;
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 24px;
    }

    .section-head h2 {
      font-size: clamp(1.7rem, 3vw, 2.35rem);
    }

    .section-head p {
      margin: 8px 0 0;
      max-width: 620px;
      color: var(--muted);
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter {
      padding: 9px 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: .88rem;
      background: rgba(18,26,45,.6);
      cursor: pointer;
      transition: all .2s ease;
    }

    .filter:hover { color: var(--text); }

    .filter.active {
      color: #07131c;
      border-color: transparent;
      font-weight: 700;
      background: linear-gradient(120deg, var(--mint), var(--indigo));
    }

    /* Cards */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .card {
      position: relative;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--panel);
      backdrop-filter: blur(12px);
      overflow: hidden;
      transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 4px;
      background: var(--accent, var(--indigo));
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(143,168,255,.38);
      box-shadow: var(--shadow);
    }

    .card.wide { grid-column: 1 / -1; }

    .card-icon {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      margin-bottom: 16px;
      border-radius: 15px;
      font-size: 1.25rem;
      background: color-mix(in srgb, var(--accent, var(--indigo)) 18%, transparent);
    }

    .card h3 {
      margin-bottom: 10px;
      font-size: 1.22rem;
    }

    .card p {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: .96rem;
    }

    .card ul {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
      font-size: .94rem;
    }

    .card li { margin: 6px 0; }
    .card li::marker { color: var(--accent, var(--indigo)); }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .chip {
      padding: 5px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: .82rem;
      background: rgba(7,11,23,.45);
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      font-size: .84rem;
      color: var(--muted);
    }

    /* Skills */
    .skill-row {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }

    .skill {
      display: grid;
      gap: 6px;
    }

    .skill-top {
      display: flex;
      justify-content: space-between;
      font-size: .9rem;
      color: var(--muted);
    }

    .bar {
      height: 8px;
      border-radius: 999px;
      background: rgba(143,168,255,.13);
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--mint), var(--indigo));
    }

    /* Timeline */
    .timeline {
      display: grid;
      gap: 14px;
    }

    .timeline-item {
      display: grid;
      grid-template-columns: 90px 1fr;
      gap: 16px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(7,11,23,.42);
    }

    .timeline-date {
      color: var(--mint);
      font-weight: 700;
      font-size: .88rem;
    }

    .timeline-item h4 {
      margin-bottom: 5px;
      font-size: 1.05rem;
    }

    .timeline-item p {
      margin: 0;
      color: var(--muted);
      font-size: .94rem;
    }

    /* Contact */
    .contact {
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 24px;
      padding: clamp(24px, 4vw, 40px);
      border: 1px solid var(--line);
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(23,34,56,.92), rgba(18,26,45,.72));
      box-shadow: var(--shadow);
    }

    .contact-links {
      display: grid;
      gap: 10px;
    }

    .contact-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 15px 18px;
      border: 1px solid var(--line);
      border-radius: 16px;
      color: var(--text);
      background: rgba(7,11,23,.45);
      transition: transform .2s ease, border-color .2s ease;
    }

    .contact-link:hover {
      transform: translateX(6px);
      border-color: rgba(92,225,198,.4);
    }

    .contact-link small {
      color: var(--muted);
    }

    footer {
      margin-top: 64px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: .88rem;
      text-align: center;
    }

    /* Responsive */
    @media (max-width: 980px) {
      .hero,
      .contact {
        grid-template-columns: 1fr;
      }

      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .nav-links { display: none; }
    }

    @media (max-width: 640px) {
      .page { width: min(100%, calc(100% - 22px)); }

      .grid {
        grid-template-columns: 1fr;
      }

      .hero-stats,
      .timeline-item {
        grid-template-columns: 1fr;
      }

      .section-head {
        align-items: start;
        flex-direction: column;
      }

      .nav {
        border-radius: 22px;
      }

      .nav-cta { padding: 9px 14px; font-size: .88rem; }
    }
  </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
const { useState } = React;

function Card({ title, icon, accent, wide, footer, children }) {
  return (
    <section
      className={"card" + (wide ? " wide" : "")}
      style={accent ? { "--accent": accent } : undefined}
    >
      {icon && <div className="card-icon" aria-hidden="true">{icon}</div>}
      <h3>{title}</h3>
      {children}
      {footer && <div className="card-footer">{footer}</div>}
    </section>
  );
}

function Chip({ children }) {
  return <span className="chip">{children}</span>;
}

function Skill({ name, level }) {
  return (
    <div className="skill">
      <div className="skill-top">
        <span>{name}</span>
        <span>{level}%</span>
      </div>
      <div className="bar">
        <div className="bar-fill" style={{ width: level + "%" }}></div>
      </div>
    </div>
  );
}

function Profile() {
  return (
    <div className="hero-visual">
      <div className="code-window">
        <div className="code-title">
          <span className="dot" style={{ background: "#ff5f57" }}></span>
          <span className="dot" style={{ background: "#febc2e" }}></span>
          <span className="dot" style={{ background: "#28c840" }}></span>
          <span>App.jsx</span>
        </div>
        <pre>
          <span className="keyword">function</span> <span className="component">Portfolio</span>() {"{"}
          {"\n"}  return (
          {"\n"}    {"<"}<span className="component">Card</span> <span className="prop">title</span>="React Developer"{" />"}
          {"\n"}  );
          {"\n"}{"}"}
        </pre>
      </div>

      <div className="hero-stats">
        <div className="stat">
          <strong>3+</strong>
          <span>Core React topics</span>
        </div>
        <div className="stat">
          <strong>5+</strong>
          <span>Practice projects</span>
        </div>
        <div className="stat">
          <strong>100%</strong>
          <span>Learning mindset</span>
        </div>
      </div>
    </div>
  );
}

function Hero() {
  return (
    <section className="hero">
      <div>
        <div className="hero-badge">● Available for learning & collaboration</div>
        <h1>
          Hi, I’m <span className="gradient-text">Mahendra Acharya</span>
        </h1>
        <p>
          Computer Engineering student at Gachon University, learning modern web
          development with React, JavaScript, and component-based design. I enjoy
          turning ideas into clean, responsive interfaces.
        </p>

        <div className="hero-actions">
          <a className="btn btn-primary" href="#projects">View Projects</a>
          <a className="btn btn-ghost" href="#contact">Contact Me</a>
        </div>
      </div>

      <Profile />
    </section>
  );
}

function About() {
  return (
    <section className="section" id="about">
      <div className="section-head">
        <div>
          <h2>About Me</h2>
          <p>
            I am building a strong foundation in front-end development while
            studying computer engineering. My focus is on reusable components,
            clean code, and responsive user interfaces.
          </p>
        </div>
      </div>

      <div className="grid">
        <Card title="Who I Am" icon="🎓" accent="#5ce1c6">
          <p>
            I am a Computer Engineering student at Gachon University with an
            interest in web development, React, and user-centered design.
          </p>
          <ul>
            <li>Learning React and modern JavaScript</li>
            <li>Interested in front-end development</li>
            <li>Building practical portfolio projects</li>
          </ul>
        </Card>

        <Card title="What I Do" icon="⚡" accent="#f6c76b">
          <p>
            I create simple, responsive web pages and practice building reusable
            React components using props, state, and JSX.
          </p>
          <div className="chips">
            <Chip>React Components</Chip>
            <Chip>Props</Chip>
            <Chip>State</Chip>
            <Chip>Responsive UI</Chip>
          </div>
        </Card>

        <Card title="My Goals" icon="🚀" accent="#8fa8ff">
          <p>
            My goal is to become a confident front-end developer and build useful
            applications that solve real problems.
          </p>
          <ul>
            <li>Master React fundamentals</li>
            <li>Build more real-world projects</li>
            <li>Learn backend development</li>
            <li>Improve UI/UX design skills</li>
          </ul>
        </Card>
      </div>
    </section>
  );
}

function Skills() {
  const skills = [
    { name: "HTML & CSS", level: 85 },
    { name: "JavaScript", level: 75 },
    { name: "React", level: 70 },
    { name: "Responsive Design", level: 80 },
    { name: "Git & GitHub", level: 70 }
  ];

  return (
    <section className="section" id="skills">
      <div className="section-head">
        <div>
          <h2>Skills</h2>
          <p>Technologies and concepts I am learning and using in my projects.</p>
        </div>
      </div>

      <div className="grid">
        <Card title="Front-End Skills" icon="🎨" accent="#5ce1c6" wide>
          <div className="skill-row">
            {skills.map((skill) => (
              <Skill key={skill.name} {...skill} />
            ))}
          </div>
        </Card>

        <Card title="Tools I Use" icon="🧰" accent="#8fa8ff">
          <div className="chips">
            <Chip>VS Code</Chip>
            <Chip>Git</Chip>
            <Chip>GitHub</Chip>
            <Chip>GitHub Pages</Chip>
            <Chip>Chrome DevTools</Chip>
            <Chip>Figma</Chip>
          </div>
        </Card>

        <Card title="Currently Learning" icon="📚" accent="#f6c76b">
          <ul>
            <li>React Hooks</li>
            <li>Component lifecycle</li>
            <li>API fetching</li>
            <li>Tailwind CSS</li>
            <li>JavaScript ES6+</li>
          </ul>
        </Card>
      </div>
    </section>
  );
}

function Projects() {
  const categories = ["All", "React", "JavaScript", "UI Design"];
  const [active, setActive] = useState("All");

  const projects = [
    {
      title: "Student Portfolio",
      category: "React",
      description:
        "A responsive personal portfolio built with reusable React components, props, and modern CSS.",
      tags: ["React", "JSX", "CSS"],
      icon: "👤",
      accent: "#5ce1c6"
    },
    {
      title: "Web Programming Hub",
      category: "React",
      description:
        "A course hub that organizes web programming notes, assignments, and learning resources.",
      tags: ["React", "GitHub Pages", "UI"],
      icon: "🌐",
      accent: "#8fa8ff"
    },
    {
      title: "Interactive Card UI",
      category: "UI Design",
      description:
        "A reusable card component with custom accent colors, hover effects, and responsive layout.",
      tags: ["props.children", "CSS", "Components"],
      icon: "🃏",
      accent: "#f6c76b"
    },
    {
      title: "JavaScript Practice",
      category: "JavaScript",
      description:
        "Practice exercises focused on arrays, objects, functions, DOM events, and ES6 features.",
      tags: ["JavaScript", "DOM", "ES6"],
      icon: "🧠",
      accent: "#ff8fb8"
    },
    {
      title: "Responsive Landing Page",
      category: "UI Design",
      description:
        "A mobile-first landing page layout with flexible grids, accessible links, and smooth animations.",
      tags: ["HTML", "CSS", "Responsive"],
      icon: "📱",
      accent: "#5ce1c6"
    },
    {
      title: "React State Demo",
      category: "React",
      description:
        "A small demo exploring useState, event handling, conditional rendering, and component updates.",
      tags: ["useState", "Events", "React"],
      icon: "🔄",
      accent: "#8fa8ff"
    }
  ];

  const visibleProjects =
    active === "All"
      ? projects
      : projects.filter((project) => project.category === active);

  return (
    <section className="section" id="projects">
      <div className="section-head">
        <div>
          <h2>Projects</h2>
          <p>
            A collection of practice projects and experiments that show my
            progress in React and front-end development.
          </p>
        </div>

        <div className="filters">
          {categories.map((category) => (
            <button
              key={category}
              className={"filter" + (active === category ? " active" : "")}
              onClick={() => setActive(category)}
            >
              {category}
            </button>
          ))}
        </div>
      </div>

      <div className="grid">
        {visibleProjects.map((project) => (
          <Card
            key={project.title}
            title={project.title}
            icon={project.icon}
            accent={project.accent}
            footer={
              <>
                <span>{project.category}</span>
                <a href="https://github.com/mahendraacharya045-byte">View →</a>
              </>
            }
          >
            <p>{project.description}</p>
            <div className="chips">
              {project.tags.map((tag) => (
                <Chip key={tag}>{tag}</Chip>
              ))}
            </div>
