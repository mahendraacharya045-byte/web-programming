<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Component | Mahendra Acharya</title>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

  <style>
    :root {
      --bg: #0b1020;
      --panel: #121a2d;
      --panel-2: #172238;
      --text: #edf2ff;
      --muted: #a9b5d1;
      --line: #2a3756;
      --mint: #5ce1c6;
      --indigo: #8fa8ff;
      --amber: #f6c76b;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.65;
      background:
        radial-gradient(ellipse at 10% 0%, rgba(92,225,198,.14), transparent 30rem),
        radial-gradient(ellipse at 95% 10%, rgba(143,168,255,.16), transparent 28rem),
        var(--bg);
    }
    h1, h2, h3 {
      margin: 0;
      font-family: ui-serif, "Iowan Old Style", Georgia, serif;
      line-height: 1.15;
    }
    a { color: var(--indigo); }
    a:focus-visible { outline: 3px solid var(--indigo); outline-offset: 3px; }

    .layout {
      width: min(1040px, calc(100% - 40px));
      margin: 0 auto;
      padding: 56px 0 72px;
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 40px;
      align-items: start;
    }

    /* Left: profile */
    .profile {
      position: sticky;
      top: 32px;
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: linear-gradient(160deg, var(--panel-2), var(--panel));
    }
    .monogram {
      display: grid;
      place-items: center;
      width: 84px;
      height: 84px;
      margin-bottom: 20px;
      border-radius: 24px;
      color: #07131c;
      font-family: ui-serif, Georgia, serif;
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--mint), var(--indigo));
      box-shadow: 0 12px 32px rgba(92,225,198,.2);
    }
    .profile h1 { font-size: 2rem; letter-spacing: -.02em; }
    .role { margin: 10px 0 0; color: var(--muted); }
    .links {
      list-style: none;
      margin: 22px 0 0;
      padding: 18px 0 0;
      border-top: 1px solid var(--line);
      display: grid;
      gap: 6px;
    }
    .links a { display: inline-block; padding: 6px 0; }

    /* Right: cards */
    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }
    .card {
      position: relative;
      padding: 26px 24px 24px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--panel);
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 5px;
      background: var(--accent, var(--indigo));
    }
    .card.wide { grid-column: 1 / -1; }
    .card h2 { margin-bottom: 14px; font-size: 1.4rem; }
    .card ul { margin: 0; padding-left: 20px; }
    .card li { margin: 6px 0; }
    .card li::marker { color: var(--accent, var(--indigo)); }
    .card p { margin: 0 0 10px; color: var(--muted); }
    .card p:last-child { margin-bottom: 0; }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .chip {
      padding: 4px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel-2);
      font-size: .92rem;
    }

    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; gap: 28px; padding-top: 36px; }
      .profile { position: static; }
    }
    @media (max-width: 560px) {
      .cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">

    // Reusable wrapper: the "children" prop is whatever goes between the tags.
    function Card({ title, accent, wide, children }) {
      return (
        <section
          className={'card' + (wide ? ' wide' : '')}
          style={accent ? { '--accent': accent } : undefined}
        >
          <h2>{title}</h2>
          {children}
        </section>
      );
    }

    function Profile() {
      return (
        <aside className="profile">
          <div className="monogram" aria-hidden="true">MA</div>
          <h1>Mahendra Acharya</h1>
          <p className="role">Computer Engineering student at Gachon University</p>
          <ul className="links">
            <li><a href="https://github.com/mahendraacharya045-byte">GitHub profile</a></li>
            <li><a href="https://mahendraacharya045-byte.github.io/web-programming/">Web Programming course hub</a></li>
          </ul>
        </aside>
      );
    }

    function App() {
      return (
        <div className="layout">
          <Profile />

          <main className="cards">
            <Card title="My Lecture Topics" accent="#5ce1c6">
              <ul>
                <li>React Components</li>
                <li>Props and State</li>
                <li>JavaScript</li>
              </ul>
            </Card>

            <Card title="My Homework" accent="#f6c76b">
              <p>Build a student portfolio component using React.</p>
              <p>Practice reusable components and props.</p>
            </Card>

            <Card title="What I Use" accent="#8fa8ff" wide>
              <div className="chips">
                <span className="chip">React 18</span>
                <span className="chip">JSX</span>
                <span className="chip">Props</span>
                <span className="chip">props.children</span>
                <span className="chip">GitHub Pages</span>
              </div>
            </Card>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);

  </script>

</body>
</html>
