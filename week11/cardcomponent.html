<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f5f5ef" />
  <meta name="description" content="Mahendra Acharya — Computer Engineering student at Gachon University, learning React and web development." />
  <title>Mahendra Acharya — Student Developer</title>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

  <style>
    :root {
      color-scheme: light;
      --paper: #f5f5ef;
      --surface: #fffefa;
      --surface-soft: #ebeee5;
      --ink: #17221d;
      --muted: #68756d;
      --line: #dce2d9;
      --green: #1c624b;
      --green-dark: #164a39;
      --lime: #c4ed75;
      --orange: #ef966c;
      --lavender: #a7a9ef;
      --shadow: 0 24px 70px rgba(29, 54, 41, .10);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 90px; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    button, a { font: inherit; }
    button { color: inherit; }
    a { color: inherit; }
    a:focus-visible, button:focus-visible { outline: 3px solid var(--orange); outline-offset: 4px; }
    .site { min-height: 100vh; background: var(--paper); color: var(--ink); transition: background .25s, color .25s; }
    .site[data-theme="dark"] {
      color-scheme: dark;
      --paper: #111a16;
      --surface: #19251f;
      --surface-soft: #202f27;
      --ink: #f0f4ed;
      --muted: #a6b4a9;
      --line: #33453a;
      --green: #a0d9b9;
      --green-dark: #bce9ce;
      --lime: #c4ed75;
      --orange: #ffad84;
      --lavender: #c1c3ff;
      --shadow: 0 24px 70px rgba(0, 0, 0, .24);
    }
    .wrap { width: min(1160px, calc(100% - 48px)); margin: 0 auto; }
    .topbar { position: sticky; z-index: 20; top: 0; border-bottom: 1px solid color-mix(in srgb, var(--line) 74%, transparent); background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(16px); }
    .nav { min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .brand { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; font-weight: 750; letter-spacing: -.03em; }
    .brand-mark { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 13px; background: var(--green); color: var(--paper); font-family: Georgia, serif; font-size: 1.03rem; letter-spacing: -.08em; }
    .nav-right, .nav-links { display: flex; align-items: center; }
    .nav-right { gap: 30px; }
    .nav-links { gap: 30px; }
    .nav-links a { color: var(--muted); text-decoration: none; font-size: .91rem; font-weight: 600; transition: color .2s; }
    .nav-links a:hover { color: var(--green); }
    .icon-button, .menu-button { display: inline-grid; place-items: center; width: 42px; height: 42px; border: 1px solid var(--line); border-radius: 50%; background: var(--surface); cursor: pointer; transition: transform .2s, border-color .2s; }
    .icon-button:hover, .menu-button:hover { transform: translateY(-2px); border-color: var(--green); }
    .icon-button svg, .menu-button svg { width: 18px; height: 18px; }
    .menu-button { display: none; border-radius: 13px; }

    .hero { position: relative; display: grid; grid-template-columns: 1.1fr .9fr; align-items: center; gap: clamp(44px, 8vw, 110px); padding: 94px 0 104px; }
    .hero-copy { position: relative; z-index: 1; }
    .eyebrow { display: inline-flex; align-items: center; gap: 10px; margin: 0 0 22px; color: var(--green); font-size: .76rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    .eyebrow::before { content: ""; width: 27px; height: 2px; border-radius: 5px; background: var(--orange); }
    h1, h2, h3, p { margin-top: 0; }
    h1, h2, h3 { letter-spacing: -.045em; }
    h1 { max-width: 670px; margin-bottom: 22px; font-family: Georgia, "Times New Roman", serif; font-size: clamp(3.45rem, 6.4vw, 6rem); font-weight: 500; line-height: .99; }
    h1 em { color: var(--green); font-weight: 500; }
    .hero-lede { max-width: 550px; margin-bottom: 30px; color: var(--muted); font-size: 1.09rem; line-height: 1.8; }
    .hero-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
    .button { min-height: 49px; display: inline-flex; justify-content: center; align-items: center; gap: 10px; padding: 0 19px; border: 1px solid transparent; border-radius: 999px; text-decoration: none; font-size: .91rem; font-weight: 700; transition: transform .2s, background .2s, border-color .2s; }
    .button:hover { transform: translateY(-2px); }
    .button-primary { background: var(--green); color: var(--paper); }
    .button-primary:hover { background: var(--green-dark); }
    .button-secondary { border-color: var(--line); background: var(--surface); }
    .button-secondary:hover { border-color: var(--green); }
    .button svg { width: 16px; height: 16px; }
    .hero-note { display: flex; align-items: center; gap: 9px; margin: 25px 0 0; color: var(--muted); font-size: .85rem; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #75b773; box-shadow: 0 0 0 4px color-mix(in srgb, #75b773 18%, transparent); }

    .visual { min-height: 420px; position: relative; display: grid; place-items: center; }
    .visual-orbit { position: absolute; width: min(390px, 90%); aspect-ratio: 1; border: 1px solid var(--line); border-radius: 50%; transform: rotate(-23deg) scaleY(.78); }
    .visual-orbit::before, .visual-orbit::after { content: ""; position: absolute; border: 1px solid var(--line); border-radius: 50%; }
    .visual-orbit::before { inset: 24px -16px; transform: rotate(39deg); }
    .visual-orbit::after { inset: -13px 34px; transform: rotate(-49deg); }
    .visual-blob { position: absolute; width: 265px; height: 310px; border-radius: 48% 52% 43% 57% / 49% 41% 59% 51%; background: var(--lime); transform: rotate(12deg); }
    .visual-blob::after { content: ""; position: absolute; inset: 14px; border: 1px solid color-mix(in srgb, var(--green) 24%, transparent); border-radius: inherit; }
    .code-card { z-index: 2; position: relative; width: min(330px, 87%); padding: 21px; border: 1px solid color-mix(in srgb, var(--line) 80%, transparent); border-radius: 20px; background: var(--surface); box-shadow: var(--shadow); transform: rotate(-4deg); }
    .code-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 26px; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .7rem; }
    .window-dots { display: flex; gap: 5px; }
    .window-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--orange); }
    .window-dots i:nth-child(2) { background: var(--lime); }
    .window-dots i:nth-child(3) { background: var(--lavender); }
    .code-line { display: flex; gap: 12px; align-items: baseline; margin: 10px 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .8rem; }
    .code-line .ln { color: var(--muted); opacity: .65; }
    .code-line .tag { color: var(--green); }
    .code-line .prop { color: #c06c45; }
    .code-line .value { color: #7f72c8; }
    .site[data-theme="dark"] .code-line .prop { color: #ffad84; }
    .site[data-theme="dark"] .code-line .value { color: #c1c3ff; }
    .float-label { position: absolute; z-index: 3; display: flex; align-items: center; gap: 9px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); box-shadow: 0 10px 30px rgba(29, 54, 41, .08); font-size: .76rem; font-weight: 700; }
    .float-label.one { top: 16%; right: -1%; transform: rotate(5deg); }
    .float-label.two { bottom: 13%; left: 0; transform: rotate(-5deg); }
    .float-icon { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; background: var(--surface-soft); color: var(--green); font-size: .74rem; }

    .intro-strip { padding: 23px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .strip-inner { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px 28px; }
    .strip-label { margin: 0; color: var(--muted); font-size: .73rem; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    .strip-items { display: flex; flex-wrap: wrap; gap: 10px; }
    .pill { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; color: var(--ink); font-size: .8rem; font-weight: 650; }
    .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--orange); }

    .section { padding: 102px 0; }
    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 38px; }
    .section-head > div { max-width: 650px; }
    .section-kicker { margin-bottom: 12px; color: var(--green); font-size: .73rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h2 { margin-bottom: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(2.5rem, 4vw, 3.7rem); font-weight: 500; line-height: 1.05; }
    .section-desc { max-width: 440px; margin: 14px 0 0; color: var(--muted); }
    .focus-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .focus-card { min-height: 248px; position: relative; padding: 26px; overflow: hidden; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); transition: transform .25s, box-shadow .25s, border-color .25s; }
    .focus-card:hover { transform: translateY(-5px); border-color: color-mix(in srgb, var(--green) 48%, var(--line)); box-shadow: var(--shadow); }
    .focus-card::after { content: attr(data-number); position: absolute; right: 13px; bottom: -40px; color: var(--surface-soft); font-family: Georgia, serif; font-size: 10rem; line-height: 1; pointer-events: none; }
    .card-icon { position: relative; z-index: 1; width: 43px; height: 43px; display: grid; place-items: center; margin-bottom: 32px; border-radius: 14px; background: var(--surface-soft); color: var(--green); }
    .card-icon svg { width: 21px; height: 21px; }
    .focus-card h3, .work-card h3 { position: relative; z-index: 1; margin-bottom: 9px; font-size: 1.16rem; letter-spacing: -.025em; }
    .focus-card p { position: relative; z-index: 1; max-width: 290px; margin: 0; color: var(--muted); font-size: .91rem; }
    .focus-card .micro-label { position: absolute; z-index: 1; top: 28px; right: 24px; color: var(--muted); font-size: .7rem; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }

    .work-section { background: var(--surface-soft); }
    .work-section .section { padding-top: 96px; padding-bottom: 100px; }
    .filter-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .filter-button { padding: 9px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--muted); cursor: pointer; font-size: .82rem; font-weight: 700; transition: .2s; }
    .filter-button:hover, .filter-button[aria-pressed="true"] { border-color: var(--green); background: var(--green); color: var(--paper); }
    .work-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .work-card { min-height: 295px; display: flex; flex-direction: column; padding: 23px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); animation: reveal .28s ease both; }
    @keyframes reveal { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .work-card-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 23px; }
    .work-symbol { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 14px; background: var(--surface-soft); color: var(--green); font-family: Georgia, serif; font-size: 1.2rem; font-weight: 700; }
    .work-type { color: var(--muted); font-size: .68rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .work-card p { margin: 0 0 20px; color: var(--muted); font-size: .89rem; }
    .work-card h3 { margin-bottom: 8px; }
    .work-bottom { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-top: auto; padding-top: 20px; border-top: 1px solid var(--line); }
    .tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { padding: 5px 9px; border-radius: 999px; background: var(--surface-soft); color: var(--muted); font-size: .69rem; font-weight: 700; }
    .text-link { display: inline-flex; align-items: center; gap: 6px; color: var(--green); text-decoration: none; font-size: .8rem; font-weight: 800; }
    .text-link:hover { text-decoration: underline; text-underline-offset: 4px; }
    .text-link svg { width: 14px; height: 14px; }

    .about-grid { display: grid; grid-template-columns: .8fr 1.2fr; gap: clamp(35px, 8vw, 110px); align-items: start; }
    .about-aside { position: relative; min-height: 310px; padding: 30px; overflow: hidden; border-radius: 22px; background: var(--green); color: #f8fff8; }
    .about-aside::after { content: "MA"; position: absolute; right: -12px; bottom: -68px; color: rgba(255,255,255,.08); font-family: Georgia, serif; font-size: 15rem; font-weight: 700; letter-spacing: -.12em; line-height: 1; }
    .about-aside .quote-mark { color: var(--lime); font-family: Georgia, serif; font-size: 4rem; line-height: .8; }
    .about-aside blockquote { position: relative; z-index: 1; max-width: 290px; margin: 23px 0 0; font-family: Georgia, serif; font-size: 1.6rem; line-height: 1.35; letter-spacing: -.025em; }
    .about-aside p { position: absolute; z-index: 1; bottom: 22px; margin: 0; color: rgba(255,255,255,.72); font-size: .8rem; }
    .about-copy h2 { margin-bottom: 23px; }
    .about-copy > p { margin-bottom: 17px; color: var(--muted); }
    .approach-list { display: grid; gap: 14px; margin: 28px 0 0; padding: 0; list-style: none; }
    .approach-list li { display: flex; align-items: start; gap: 12px; color: var(--ink); font-size: .9rem; }
    .check { flex: 0 0 22px; height: 22px; display: grid; place-items: center; margin-top: 1px; border-radius: 50%; background: var(--surface-soft); color: var(--green); font-size: .73rem; font-weight: 900; }
    .footer { padding: 34px 0; border-top: 1px solid var(--line); }
    .footer-inner { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
    .footer p { margin: 0; color: var(--muted); font-size: .81rem; }
    .footer-links { display: flex; flex-wrap: wrap; gap: 18px; }
    .footer-links a { color: var(--green); text-decoration: none; font-size: .81rem; font-weight: 750; }
    .footer-links a:hover { text-decoration: underline; text-underline-offset: 4px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    @media (max-width: 900px) {
      .hero { gap: 28px; padding: 74px 0 78px; }
      .visual { min-height: 360px; }
      .visual-blob { width: 220px; height: 270px; }
      .focus-grid, .work-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .section-head { align-items: start; flex-direction: column; }
      .about-grid { grid-template-columns: .9fr 1.1fr; gap: 38px; }
    }
    @media (max-width: 680px) {
      .wrap { width: min(100% - 36px, 520px); }
      .nav { min-height: 68px; }
      .menu-button { display: inline-grid; }
      .nav-right { gap: 9px; }
      .nav-links { position: absolute; top: 68px; left: 0; right: 0; display: none; align-items: stretch; gap: 0; padding: 8px 18px 17px; border-bottom: 1px solid var(--line); background: var(--paper); box-shadow: 0 14px 20px rgba(20, 40, 30, .06); }
      .nav-links.open { display: grid; }
      .nav-links a { padding: 12px 4px; border-bottom: 1px solid var(--line); }
      .nav-links a:last-child { border-bottom: 0; }
      .hero { grid-template-columns: 1fr; gap: 10px; padding: 68px 0 54px; }
      h1 { max-width: 540px; font-size: clamp(3.3rem, 14vw, 5.2rem); }
      .hero-lede { font-size: 1rem; }
      .visual { min-height: 330px; margin: 4px 0 0; }
      .visual-blob { width: 210px; height: 245px; }
      .float-label.one { right: 2%; top: 12%; }
      .float-label.two { left: 3%; bottom: 10%; }
      .strip-inner { align-items: start; flex-direction: column; }
      .section, .work-section .section { padding: 72px 0; }
      .focus-grid, .work-grid { grid-template-columns: 1fr; }
      .focus-card { min-height: 220px; }
      .card-icon { margin-bottom: 25px; }
      .work-card { min-height: 260px; }
      .about-grid { grid-template-columns: 1fr; }
      .about-aside { min-height: 260px; }
      .about-aside blockquote { max-width: 300px; font-size: 1.45rem; }
      .footer-inner { align-items: start; flex-direction: column; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const Icon = ({ name }) => {
      const paths = {
        arrow: <><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></>,
        external: <><path d="M14 3h7v7"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></>,
        sun: <><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></>,
        moon: <path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/>,
        menu: <><path d="M4 7h16M4 12h16M4 17h16"/></>,
        components: <><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="10" width="8" height="11" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/></>,
        state: <><path d="M12 3v18M3 12h18"/><circle cx="12" cy="12" r="8"/></>,
        code: <><path d="m8 8-4 4 4 4M16 8l4 4-4 4m-2-10-4 12"/></>
      };
      return <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">{paths[name]}</svg>;
    };

    const focusItems = [
      { number: "01", icon: "components", label: "Structure", title: "React components", text: "Breaking an interface into small, reusable pieces that each have a clear purpose." },
      { number: "02", icon: "state", label: "Interaction", title: "Props & state", text: "Passing information into components and learning how state makes an interface respond." },
      { number: "03", icon: "code", label: "Foundations", title: "JavaScript", text: "Building the language fundamentals behind dynamic, interactive web experiences." }
    ];

    const workItems = [
      { category: "Coursework", symbol: "{ }", title: "Student portfolio", text: "A portfolio exercise for practicing a clear page structure, reusable UI, and responsive styling.", tags: ["React 18", "Components", "CSS"] },
      { category: "Coursework", symbol: "↗", title: "Web programming hub", text: "A course home base for web programming materials and ongoing class work.", tags: ["Web programming", "Coursework"], href: "https://mahendraacharya045-byte.github.io/web-programming/", link: "Open course hub" },
      { category: "Concepts", symbol: "<> ", title: "Composable UI", text: "Practicing props and children to make flexible components that can be reused across a page.", tags: ["JSX", "Props", "Children"] },
      { category: "Concepts", symbol: "↻", title: "Responsive layouts", text: "Exploring layouts that adapt comfortably from a wide desktop screen to a small phone.", tags: ["CSS", "Responsive design"] },
      { category: "Coursework", symbol: "JS", title: "JavaScript practice", text: "Strengthening the programming basics used to bring behavior and interaction into a website.", tags: ["JavaScript", "Fundamentals"] }
    ];

    function Header({ theme, onThemeToggle }) {
      const [menuOpen, setMenuOpen] = useState(false);
      const closeMenu = () => setMenuOpen(false);
      return <header className="topbar"><div className="wrap nav">
        <a className="brand" href="#home" onClick={closeMenu} aria-label="Mahendra Acharya, home"><span className="brand-mark">MA</span><span>Mahendra Acharya</span></a>
        <nav className={'nav-links' + (menuOpen ? ' open' : '')} aria-label="Main navigation">
          <a href="#learning" onClick={closeMenu}>Learning</a><a href="#coursework" onClick={closeMenu}>Coursework</a><a href="#about" onClick={closeMenu}>About</a><a href="#links" onClick={closeMenu}>Links</a>
        </nav>
        <div className="nav-right">
          <button className="icon-button" type="button" onClick={onThemeToggle} aria-label={'Switch to ' + (theme === 'light' ? 'dark' : 'light') + ' theme'} title="Toggle color theme"><Icon name={theme === 'light' ? 'moon' : 'sun'} /></button>
          <button className="menu-button" type="button" onClick={() => setMenuOpen(!menuOpen)} aria-expanded={menuOpen} aria-label={menuOpen ? 'Close menu' : 'Open menu'}><Icon name="menu" /></button>
        </div>
      </div></header>;
    }

    function Hero() {
      return <section className="wrap hero" id="home">
        <div className="hero-copy">
          <p className="eyebrow">Computer Engineering · Gachon University</p>
          <h1>Building ideas,<br />one <em>component</em><br />at a time.</h1>
          <p className="hero-lede">Hi, I’m Mahendra. I’m learning how thoughtful code and clear design come together to make the web more useful and enjoyable.</p>
          <div className="hero-actions">
            <a className="button button-primary" href="#learning">Explore what I’m learning <Icon name="arrow" /></a>
            <a className="button button-secondary" href="https://github.com/mahendraacharya045-byte" target="_blank" rel="noreferrer">Visit my GitHub <Icon name="external" /></a>
          </div>
          <p className="hero-note"><span className="status-dot" aria-hidden="true"></span> Currently exploring React and web development</p>
        </div>
        <div className="visual" aria-label="Illustration of a React component with props">
          <div className="visual-orbit"></div><div className="visual-blob"></div>
          <div className="code-card">
            <div className="code-top"><span className="window-dots"><i></i><i></i><i></i></span><span>ProfileCard.jsx</span><span>•••</span></div>
            <div className="code-line"><span className="ln">01</span><span><span className="tag">function</span> ProfileCard&#40;&#123; <span className="prop">name</span> &#125;&#41; &#123;</span></div>
            <div className="code-line"><span className="ln">02</span><span>&nbsp;&nbsp;<span className="tag">return</span> &#40;</span></div>
            <div className="code-line"><span className="ln">03</span><span>&nbsp;&nbsp;&nbsp;&nbsp;&lt;<span className="tag">Card</span>&gt;&#123;<span className="value">name</span>&#125;&lt;/<span className="tag">Card</span>&gt;</span></div>
            <div className="code-line"><span className="ln">04</span><span>&nbsp;&nbsp;&#41;;</span></div>
            <div className="code-line"><span className="ln">05</span><span>&#125;</span></div>
          </div>
          <div className="float-label one"><span className="float-icon">✳</span> Reusable by design</div>
          <div className="float-label two"><span className="float-icon">↗</span> Learning by building</div>
        </div>
      </section>;
    }

    function Learning() {
      return <section className="wrap section" id="learning">
        <div className="section-head"><div><p className="section-kicker">A few things on my desk</p><h2>Learning the building blocks.</h2><p className="section-desc">I’m connecting the fundamentals of programming with the practical choices that make a web page feel complete.</p></div></div>
        <div className="focus-grid">{focusItems.map(item => <article className="focus-card" data-number={item.number} key={item.title}>
          <span className="micro-label">{item.label}</span><div className="card-icon"><Icon name={item.icon} /></div><h3>{item.title}</h3><p>{item.text}</p>
        </article>)}</div>
      </section>;
    }

    function Coursework() {
      const [filter, setFilter] = useState('All');
      const filters = ['All', 'Coursework', 'Concepts'];
      const shownItems = filter === 'All' ? workItems : workItems.filter(item => item.category === filter);
      return <section className="work-section" id="coursework"><div className="wrap section">
        <div className="section-head"><div><p className="section-kicker">Practice in progress</p><h2>Learning through making.</h2><p className="section-desc">A snapshot of the exercises and ideas shaping my web development journey.</p></div>
          <div className="filter-row" role="group" aria-label="Filter coursework cards">{filters.map(option => <button key={option} className="filter-button" type="button" aria-pressed={filter === option} onClick={() => setFilter(option)}>{option}</button>)}</div>
        </div>
        <div className="work-grid" aria-live="polite">{shownItems.map(item => <article className="work-card" key={item.title}>
          <div className="work-card-top"><span className="work-symbol" aria-hidden="true">{item.symbol}</span><span className="work-type">{item.category}</span></div>
          <h3>{item.title}</h3><p>{item.text}</p>
          <div className="work-bottom"><div className="tag-list">{item.tags.map(tag => <span className="tag" key={tag}>{tag}</span>)}</div>
            {item.href && <a className="text-link" href={item.href} target="_blank" rel="noreferrer">{item.link}<Icon name="external" /></a>}
          </div>
        </article>)}</div>
      </div></section>;
    }

    function About() {
      return <section className="wrap section" id="about"><div className="about-grid">
        <div className="about-aside"><span className="quote-mark">“</span><blockquote>Good interfaces start with curiosity and get better with practice.</blockquote><p>Mahendra Acharya · Student developer</p></div>
        <div className="about-copy"><p className="section-kicker">A little about me</p><h2>Curious about how the web works.</h2>
          <p>I’m a Computer Engineering student at Gachon University. Right now, I’m focused on web programming and the building blocks of React.</p>
          <p>This page is part profile and part practice space: a way to learn by organizing ideas, composing components, and making the layout work across screen sizes.</p>
          <ul className="approach-list"><li><span className="check">✓</span><span>Start with a clear structure and a useful purpose.</span></li><li><span className="check">✓</span><span>Build reusable pieces with components and props.</span></li><li><span className="check">✓</span><span>Keep refining the experience for different screens.</span></li></ul>
        </div>
      </div></section>;
    }

    function App() {
      const [theme, setTheme] = useState(() => {
        try { return localStorage.getItem('mahendra-portfolio-theme') || 'light'; } catch { return 'light'; }
      });
      const toggleTheme = () => setTheme(current => {
        const next = current === 'light' ? 'dark' : 'light';
        try { localStorage.setItem('mahendra-portfolio-theme', next); } catch {}
        return next;
      });
      return <div className="site" data-theme={theme}>
        <Header theme={theme} onThemeToggle={toggleTheme} />
        <main><Hero />
          <div className="intro-strip"><div className="wrap strip-inner"><p className="strip-label">Currently exploring</p><div className="strip-items"><span className="pill">React 18</span><span className="pill">JSX</span><span className="pill">Props &amp; state</span><span className="pill">GitHub Pages</span></div></div></div>
          <Learning /><Coursework /><About />
          <section className="wrap" id="links" aria-label="More links" style={{paddingBottom: '68px'}}>
            <div className="section-head"><div><p className="section-kicker">Find me online</p><h2>Keep exploring.</h2></div><div className="hero-actions"><a className="button button-primary" href="https://github.com/mahendraacharya045-byte" target="_blank" rel="noreferrer">GitHub profile <Icon name="external" /></a><a className="button button-secondary" href="https://mahendraacharya045-byte.github.io/web-programming/" target="_blank" rel="noreferrer">Course hub <Icon name="external" /></a></div></div>
          </section>
        </main>
        <footer className="footer"><div className="wrap footer-inner"><p>© {new Date().getFullYear()} Mahendra Acharya · Built as a learning project</p><div className="footer-links"><a href="#home">Back to top ↑</a></div></div></footer>
      </div>;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
