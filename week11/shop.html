<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Campus Shop: an interactive React shopping cart by Mahendra Acharya.">
<title>Campus Shop | Mahendra Acharya</title>
<script>
  try {
    var t = localStorage.getItem('theme');
    if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
  } catch (e) { document.documentElement.dataset.theme = 'dark'; }
</script>
<style>
  :root{color-scheme:dark;--bg:#0b1020;--panel:#121a2d;--text:#edf2ff;--muted:#9ba8c7;--line:#2a3756;--accent:#8fa8ff;--mint:#5ce1c6;--danger:#ff8d8d;--on-accent:#0b1020}
  :root[data-theme="light"]{color-scheme:light;--bg:#f6f8fc;--panel:#ffffff;--text:#14192b;--muted:#4a5470;--line:#cfd6e6;--accent:#2f4bd1;--mint:#2f4bd1;--danger:#b00020;--on-accent:#ffffff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6}
  .wrap{width:min(1000px,calc(100% - 40px));margin:0 auto}
  a{color:var(--accent)}
  a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
  .site-header{border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:12px 0}
  .brand{font-weight:800;text-decoration:none;color:var(--text)}
  .badge{display:inline-flex;align-items:center;gap:8px;padding:4px 12px;border:1px solid var(--mint);border-radius:999px;background:var(--panel);font-size:.9rem;font-weight:600}
  .badge svg{width:20px;height:20px;color:var(--mint)}
  main{padding:32px 0 56px}
  h1{margin:0 0 6px;font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.1;letter-spacing:-.03em}
  .lead{margin:0 0 24px;color:var(--muted)}
  .layout{display:grid;grid-template-columns:1fr 310px;gap:24px;align-items:start}
  .products{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
  .card{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--panel)}
  .card img{display:block;width:100%;height:120px;object-fit:cover;border-radius:8px;background:var(--line)}
  .card h3{margin:10px 0 2px;font-size:1rem}
  .price{margin:0 0 10px;color:var(--muted)}
  .btn{width:100%;min-height:44px;padding:8px;border:1px solid var(--accent);border-radius:10px;background:var(--accent);color:var(--on-accent);font:inherit;font-weight:600;cursor:pointer}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .cart{position:sticky;top:16px;border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--panel)}
  .cart h2{margin:0 0 12px;font-size:1.15rem}
  .cart ul{list-style:none;padding:0;margin:0}
  .cart li{padding:10px 0;border-bottom:1px solid var(--line)}
  .line{display:flex;justify-content:space-between;gap:8px}
  .qty{display:flex;align-items:center;gap:8px;margin-top:6px}
  .qty button{width:36px;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit;cursor:pointer}
  .qty .link{width:auto;height:auto;margin-left:auto;padding:4px;border:0;background:none;color:var(--danger);text-decoration:underline}
  .total{display:flex;justify-content:space-between;margin:14px 0;font-size:1.15rem}
  .empty,.note{color:var(--muted)}
  .done{color:var(--mint);font-weight:600}
  .site-footer{padding:24px 0;border-top:1px solid var(--line);color:var(--muted)}
  @media (max-width:720px){.layout{grid-template-columns:1fr}.cart{position:static}}
</style>
<script defer src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.js"></script>
</head>
<body>
<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="index.html">Mahendra Acharya</a>
    <span class="badge" id="react-badge"></span>
  </div>
</header>

<main class="wrap">
  <div id="root">
    <h1>Campus Shop</h1>
    <p class="note">This shop needs JavaScript to run. <a href="index.html">Back to my portfolio</a>.</p>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">© 2026 Mahendra Acharya · <a href="index.html#projects">Back to projects</a></div>
</footer>

<script>
document.addEventListener('DOMContentLoaded', function () {
  if (!window.React || !window.ReactDOM || !window.htm) return;
  const { useState, useEffect } = React;
  const html = htm.bind(React.createElement);

  const PRODUCTS = [
    { id: 1, name: 'Canvas Backpack', price: 48, image: 'https://picsum.photos/seed/backpack/300/200' },
    { id: 2, name: 'Ceramic Mug', price: 14, image: 'https://picsum.photos/seed/mug/300/200' },
    { id: 3, name: 'Desk Lamp', price: 32, image: 'https://picsum.photos/seed/lamp/300/200' },
    { id: 4, name: 'Notebook Set', price: 9, image: 'https://picsum.photos/seed/notebook/300/200' },
    { id: 5, name: 'Wireless Mouse', price: 25, image: 'https://picsum.photos/seed/mouse/300/200' },
    { id: 6, name: 'Water Bottle', price: 18, image: 'https://picsum.photos/seed/bottle/300/200' },
  ];
  const money = n => '$' + n.toFixed(2);

  function ProductList({ products, cart, onAdd, onRemove }) {
    return html`<section class="products" aria-label="Products">
      ${products.map(p => {
        const inCart = cart.some(item => item.id === p.id);
        return html`<article class="card" key=${p.id}>
          <img src=${p.image} alt=${p.name} width="300" height="200" loading="lazy" />
          <h3>${p.name}</h3>
          <p class="price">${money(p.price)}</p>
          ${inCart
            ? html`<button class="btn ghost" type="button" onClick=${() => onRemove(p.id)}>Remove from cart</button>`
            : html`<button class="btn" type="button" onClick=${() => onAdd(p)}>Add to cart</button>`}
        </article>`;
      })}
    </section>`;
  }

  function CartPanel({ cart, ordered, onChangeQty, onRemove, onCheckout }) {
    // Derived values: computed from state on every render, never stored in state
    const total = cart.reduce((sum, i) => sum + i.price * i.qty, 0);
    const count = cart.reduce((sum, i) => sum + i.qty, 0);
    return html`<aside class="cart" aria-label="Shopping cart">
      <h2>Your cart (${count})</h2>
      ${cart.length === 0 && html`<p class="empty">Your cart is empty. Add a product to start.</p>`}
      <ul>
        ${cart.map(item => html`<li key=${item.id}>
          <div class="line"><span>${item.name}</span><span>${money(item.price * item.qty)}</span></div>
          <div class="qty">
            <button type="button" aria-label=${'Decrease ' + item.name} onClick=${() => onChangeQty(item.id, -1)}>-</button>
            <span aria-live="polite">${item.qty}</span>
            <button type="button" aria-label=${'Increase ' + item.name} onClick=${() => onChangeQty(item.id, 1)}>+</button>
            <button type="button" class="link" onClick=${() => onRemove(item.id)}>Remove</button>
          </div>
        </li>`)}
      </ul>
      <div class="total"><span>Total</span><strong>${money(total)}</strong></div>
      <button class="btn" type="button" disabled=${cart.length === 0} onClick=${onCheckout}>Checkout</button>
      <p class="done" role="status">${ordered ? 'Thanks! This is a demo, so no real order was placed.' : ''}</p>
    </aside>`;
  }

  // Owns the state (lifting state up); passes data down as props and handlers as callbacks
  function ShoppingCart() {
    const [cart, setCart] = useState(() => {
      try { return JSON.parse(localStorage.getItem('cart')) || []; } catch (e) { return []; }
    });
    const [ordered, setOrdered] = useState(false);

    useEffect(() => {
      try { localStorage.setItem('cart', JSON.stringify(cart)); } catch (e) {}
    }, [cart]);

    const update = fn => { setOrdered(false); setCart(fn); };
    const addToCart = p => update(prev => [...prev, { ...p, qty: 1 }]);
    const removeFromCart = id => update(prev => prev.filter(i => i.id !== id));
    const changeQty = (id, delta) => update(prev =>
      prev.map(i => i.id === id ? { ...i, qty: i.qty + delta } : i).filter(i => i.qty > 0));
    const checkout = () => { setCart([]); setOrdered(true); };

    return html`<div>
      <h1>Campus Shop</h1>
      <p class="lead">A small React project: state, props, callbacks and derived values. Your cart is saved in this browser.</p>
      <div class="layout">
        <${ProductList} products=${PRODUCTS} cart=${cart} onAdd=${addToCart} onRemove=${removeFromCart} />
        <${CartPanel} cart=${cart} ordered=${ordered} onChangeQty=${changeQty} onRemove=${removeFromCart} onCheckout=${checkout} />
      </div>
    </div>`;
  }

  function ReactBadge() {
    return html`<${React.Fragment}>
      <svg viewBox="-12 -12 24 24" fill="none" stroke="currentColor" strokeWidth="1.2" aria-hidden="true">
        <circle r="2" fill="currentColor" stroke="none" />
        <ellipse rx="11" ry="4.2" />
        <ellipse rx="11" ry="4.2" transform="rotate(60)" />
        <ellipse rx="11" ry="4.2" transform="rotate(120)" />
      </svg>
      Built with React ${React.version}
    <//>`;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(ShoppingCart));
  ReactDOM.createRoot(document.getElementById('react-badge')).render(React.createElement(ReactBadge));
});
</script>
</body>
</html>
