<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications</title>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

  <style>
    :root {
      --bg: #f4f6f9;
      --panel: #ffffff;
      --text: #14192b;
      --muted: #4a5470;
      --line: #d5dbe8;
      --success: #15803d;
      --warning: #b45309;
      --info: #1d4ed8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.6;
    }
    main {
      width: min(560px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0;
    }
    h1 {
      margin: 0 0 4px;
      font-family: ui-serif, Georgia, serif;
      font-size: 2rem;
    }
    .count { margin: 0 0 20px; color: var(--muted); }
    ul { list-style: none; margin: 0; padding: 0; }
    .notification {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px;
      margin: 0 0 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-left: 5px solid var(--accent);
      border-radius: 10px;
    }
    .notification.success { --accent: var(--success); }
    .notification.warning { --accent: var(--warning); }
    .notification.info    { --accent: var(--info); }
    .label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
    }
    .icon { font-size: 1.3rem; line-height: 1.3; }
  </style>
</head>

<body>

  <div id="root"></div>

  <script type="text/babel">

    const notifications = [
      { id: 1, type: 'success', message: 'Profile updated successfully' },
      { id: 2, type: 'warning', message: 'Assignment deadline is approaching' },
      { id: 3, type: 'info', message: 'New lecture materials available' },
    ];

    const TYPES = {
      success: { icon: '✅', label: 'Success' },
      warning: { icon: '⚠️', label: 'Warning' },
      info:    { icon: 'ℹ️', label: 'Info' },
    };

    function NotificationItem({ type, message }) {
      const { icon, label } = TYPES[type] ?? TYPES.info;

      return (
        <li className={'notification ' + type}>
          <span className="icon" aria-hidden="true">{icon}</span>
          <div>
            <span className="label">{label}</span>
            {message}
          </div>
        </li>
      );
    }

    function NotificationList() {
      return (
        <main>
          <h1>Notifications</h1>
          <p className="count">
            {notifications.length} {notifications.length === 1 ? 'notification' : 'notifications'}
          </p>

          <ul>
            {notifications.map(n => (
              <NotificationItem
                key={n.id}
                type={n.type}
                message={n.message}
              />
            ))}
          </ul>
        </main>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <NotificationList />
    );

  </script>

</body>
</html>
