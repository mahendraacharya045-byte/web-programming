<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f3f5f1" />
  <meta name="description" content="Mahendra Acharya's student profile card, built with React." />
  <title>My Profile · Mahendra Acharya</title>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

  <style>
    :root {
      color-scheme: light;
      --bg: #f3f5f1;
      --surface: #fff;
      --surface-alt: #f8faf7;
      --ink: #18251f;
      --muted: #69766f;
      --line: #e0e7e1;
      --green: #286a50;
      --green-dark: #1c543d;
      --green-soft: #eaf4ed;
      --lime: #d4f08e;
      --red: #bd4b4b;
      --red-soft: #fff0ed;
      --shadow: 0 18px 55px rgba(35, 62, 45, .08);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.55; -webkit-font-smoothing: antialiased; }
    button, input { font: inherit; }
    button { color: inherit; }
    button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid #e6a37f; outline-offset: 3px; }
    .app { min-height: 100vh; background: var(--bg); color: var(--ink); transition: background .25s, color .25s; }
    .app[data-theme="dark"] {
      color-scheme: dark;
      --bg: #121a16;
      --surface: #1a261f;
      --surface-alt: #202e26;
      --ink: #edf4ee;
      --muted: #a3b2a7;
      --line: #33463a;
      --green: #a7d9b9;
      --green-dark: #c1e8cd;
      --green-soft: #253d2f;
      --lime: #d4f08e;
      --red: #ffaaa0;
      --red-soft: #462c2a;
      --shadow: 0 18px 55px rgba(0, 0, 0, .23);
    }
    .wrap { width: min(1120px, calc(100% - 44px)); margin: 0 auto; }
    .topbar { height: 74px; display: flex; align-items: center; border-bottom: 1px solid var(--line); background: var(--surface); }
    .topbar-inner { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { display: inline-flex; align-items: center; gap: 11px; color: var(--ink); text-decoration: none; font-size: .91rem; font-weight: 800; letter-spacing: -.025em; }
    .brand-mark { width: 37px; height: 37px; display: grid; place-items: center; border-radius: 13px; background: var(--green); color: var(--bg); font-family: Georgia, serif; font-weight: 700; }
    .top-note { margin: 0 auto 0 20px; color: var(--muted); font-size: .83rem; }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .top-button { min-height: 39px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 13px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); cursor: pointer; font-size: .78rem; font-weight: 750; transition: transform .18s, border .18s; }
    .top-button:hover { transform: translateY(-1px); border-color: var(--green); }
    .top-button svg { width: 16px; height: 16px; }

    main { padding: 48px 0 72px; }
    .page-intro { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 27px; }
    .eyebrow { margin: 0 0 8px; color: var(--green); font-size: .71rem; font-weight: 850; letter-spacing: .14em; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 8px; font-family: Georgia, "Times New Roman", serif; font-size: clamp(2.6rem, 5vw, 4rem); font-weight: 500; letter-spacing: -.055em; line-height: 1; }
    .intro-copy { max-width: 565px; margin: 0; color: var(--muted); font-size: .96rem; }
    .intro-mark { position: relative; width: 72px; height: 72px; flex: 0 0 72px; display: grid; place-items: center; border-radius: 25px; background: var(--lime); color: #244535; transform: rotate(7deg); }
    .intro-mark::before { content: ""; position: absolute; inset: 7px; border: 1px solid rgba(36,69,53,.25); border-radius: 19px; }
    .intro-mark svg { width: 29px; height: 29px; }

    .dashboard { display: grid; grid-template-columns: minmax(270px, .82fr) minmax(0, 1.48fr); align-items: start; gap: 19px; }
    .column { display: grid; gap: 18px; min-width: 0; }
    .card { border: 1px solid var(--line); border-radius: 20px; background: var(--surface); box-shadow: 0 3px 12px rgba(32, 55, 39, .025); }
    .identity-card { padding: 28px; text-align: center; overflow: hidden; }
    .identity-art { height: 105px; position: relative; display: grid; place-items: center; margin: -28px -28px 0; overflow: hidden; background: linear-gradient(120deg, #d8edca, #c1e7ce 53%, #e3f0ce); }
    .identity-art::before, .identity-art::after { content: ""; position: absolute; width: 160px; height: 160px; border: 1px solid rgba(40,106,80,.19); border-radius: 50%; }
    .identity-art::before { top: -98px; left: 11%; }
    .identity-art::after { right: 8%; bottom: -131px; width: 210px; height: 210px; }
    .art-label { z-index: 1; padding: 5px 10px; border: 1px solid rgba(40,106,80,.18); border-radius: 999px; color: #316449; background: rgba(255,255,255,.35); font-size: .62rem; font-weight: 850; letter-spacing: .12em; text-transform: uppercase; }
    .avatar-wrap { position: relative; width: 106px; height: 106px; margin: -53px auto 15px; padding: 5px; border-radius: 50%; background: var(--surface); box-shadow: 0 5px 17px rgba(25, 50, 34, .12); }
    .avatar-image, .avatar-fallback { width: 100%; height: 100%; display: grid; place-items: center; border-radius: 50%; object-fit: cover; }
    .avatar-fallback { background: linear-gradient(140deg, #285f48, #9cc98f); color: #fff; font-family: Georgia, serif; font-size: 2rem; font-weight: 600; }
    .online-indicator { position: absolute; right: 6px; bottom: 6px; width: 17px; height: 17px; border: 3px solid var(--surface); border-radius: 50%; background: #52ad73; }
    .online-indicator.offline { background: #98a19b; }
    .identity-card h2 { margin: 0 0 5px; font-size: 1.36rem; letter-spacing: -.04em; }
    .role { margin: 0; color: var(--muted); font-size: .84rem; }
    .university { display: inline-flex; align-items: center; gap: 7px; margin: 13px 0 0; padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: .72rem; font-weight: 700; }
    .university svg { width: 14px; height: 14px; color: var(--green); }
    .status-row { display: flex; justify-content: center; margin-top: 16px; }
    .status-pill { display: inline-flex; align-items: center; gap: 7px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: .72rem; font-weight: 750; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #52ad73; }
    .status-dot.offline { background: #98a19b; }
    .divider { height: 1px; margin: 21px 0; background: var(--line); }
    .profile-summary { margin: 0; color: var(--muted); font-size: .83rem; line-height: 1.7; }
    .identity-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 21px; }
    .button { min-height: 42px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 12px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); cursor: pointer; color: var(--ink); font-size: .78rem; font-weight: 780; transition: transform .18s, border-color .18s, background .18s; }
    .button:hover { transform: translateY(-1px); border-color: var(--green); }
    .button svg { width: 16px; height: 16px; }
    .button.primary { border-color: var(--green); background: var(--green); color: var(--bg); }
    .button.primary:hover { background: var(--green-dark); }
    .button.following { border-color: color-mix(in srgb, var(--green) 40%, var(--line)); background: var(--green-soft); color: var(--green); }
    .button.danger { color: var(--red); }
    .button.danger:hover { border-color: var(--red); background: var(--red-soft); }

    .section-card { padding: 23px 25px; }
    .section-title-row { display: flex; justify-content: space-between; align-items: start; gap: 15px; margin-bottom: 19px; }
    .section-title-row h2 { margin: 0 0 5px; font-size: 1.05rem; letter-spacing: -.025em; }
    .section-title-row p { margin: 0; color: var(--muted); font-size: .77rem; }
    .section-symbol { width: 37px; height: 37px; flex: 0 0 37px; display: grid; place-items: center; border-radius: 12px; background: var(--green-soft); color: var(--green); }
    .section-symbol svg { width: 18px; height: 18px; }

    .facts { display: grid; gap: 0; }
    .fact { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
    .fact:first-child { border-top: 0; padding-top: 0; }
    .fact:last-child { padding-bottom: 0; }
    .fact-icon { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 11px; background: var(--surface-alt); color: var(--green); }
    .fact-icon svg { width: 17px; height: 17px; }
    .fact-label { display: block; margin-bottom: 2px; color: var(--muted); font-size: .68rem; font-weight: 700; }
    .fact-value { overflow: hidden; color: var(--ink); font-size: .82rem; font-weight: 750; text-overflow: ellipsis; white-space: nowrap; }
    .show-button { padding: 6px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--green); cursor: pointer; font-size: .7rem; font-weight: 800; white-space: nowrap; }
    .show-button:hover { border-color: var(--green); }
    .email-link { color: var(--green); text-decoration: none; }
    .email-link:hover { text-decoration: underline; text-underline-offset: 3px; }

    .skill-list { display: flex; flex-wrap: wrap; gap: 9px; }
    .skill-chip { display: inline-flex; align-items: center; gap: 8px; min-height: 34px; padding: 5px 7px 5px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface-alt); color: var(--ink); font-size: .76rem; font-weight: 700; animation: pop .18s ease both; }
    @keyframes pop { from { opacity: .3; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
    .remove-skill { width: 21px; height: 21px; display: grid; place-items: center; border: 0; border-radius: 50%; background: transparent; color: var(--muted); cursor: pointer; font-size: 1rem; line-height: 1; }
    .remove-skill:hover { background: var(--red-soft); color: var(--red); }
    .skill-form { display: flex; gap: 9px; margin-top: 19px; }
    .input { min-width: 0; width: 100%; height: 42px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); outline: none; font-size: .78rem; transition: border .18s, box-shadow .18s; }
    .input::placeholder { color: #9aa49c; }
    .input:focus { border-color: var(--green); box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 13%, transparent); }
    .add-button { flex: 0 0 auto; padding: 0 14px; border: 0; border-radius: 10px; background: var(--green); color: var(--bg); cursor: pointer; font-size: .76rem; font-weight: 800; transition: transform .18s; }
    .add-button:hover { transform: translateY(-1px); }
    .add-button:disabled { opacity: .45; cursor: not-allowed; transform: none; }
    .form-message { min-height: 18px; margin: 8px 0 0; color: var(--muted); font-size: .7rem; }

    .completion-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
    .completion-head strong { font-size: .83rem; }
    .completion-number { color: var(--green); font-family: Georgia, serif; font-size: 1.3rem; font-weight: 700; }
    .progress { height: 9px; overflow: hidden; border-radius: 999px; background: var(--surface-alt); }
    .progress-bar { height: 100%; border-radius: inherit; background: linear-gradient(90deg, #4c8d64, #9fcf75); transition: width .3s ease; }
    .completion-caption { margin: 10px 0 0; color: var(--muted); font-size: .74rem; }
    .edit-form { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
    .field { display: grid; gap: 6px; }
    .field.full { grid-column: 1 / -1; }
    .field label { color: var(--muted); font-size: .71rem; font-weight: 750; }
    .edit-notice { display: flex; align-items: center; gap: 7px; margin: 13px 0 0; color: var(--green); font-size: .72rem; font-weight: 700; }
    .edit-notice svg { width: 15px; height: 15px; }
    .reset-row { display: flex; justify-content: space-between; align-items: center; gap: 15px; }
    .reset-row p { max-width: 330px; margin: 0; color: var(--muted); font-size: .75rem; }
    .footer { padding: 23px 0; border-top: 1px solid var(--line); color: var(--muted); font-size: .72rem; }
    .footer-inner { display: flex; justify-content: space-between; gap: 18px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    @media (max-width: 760px) {
      .wrap { width: min(100% - 34px, 560px); }
      .top-note { display: none; }
      main { padding: 35px 0 56px; }
      .dashboard { grid-template-columns: 1fr; }
      .identity-card { padding: 24px; }
      .identity-art { margin: -24px -24px 0; }
      .page-intro { align-items: center; }
      .intro-mark { width: 60px; height: 60px; flex-basis: 60px; border-radius: 21px; }
    }
    @media (max-width: 480px) {
      .wrap { width: calc(100% - 28px); }
      .topbar { height: 66px; }
      .top-button { width: 39px; min-height: 39px; padding: 0; font-size: 0; }
      .top-button svg { width: 18px; height: 18px; }
      .page-intro { align-items: start; }
      h1 { font-size: 2.75rem; }
      .intro-mark { display: none; }
      .intro-copy { font-size: .88rem; }
      .section-card { padding: 19px; }
      .fact { grid-template-columns: 34px minmax(0, 1fr); gap: 9px; }
      .fact .show-button { grid-column: 2; justify-self: start; }
      .fact-icon { width: 33px; height: 33px; }
      .edit-form { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .reset-row { align-items: start; flex-direction: column; }
      .footer-inner { flex-direction: column; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    function Icon({ name }) {
      const paths = {
        sun: <><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></>,
        moon: <path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/>,
        school: <><path d="m3 10 9-6 9 6-9 6-9-6Z"/><path d="M7 13v5c3.3 2.4 6.7 2.4 10 0v-5M21 10v6"/></>,
        mail: <><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></>,
        spark: <><path d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z"/><path d="m19 16 .9 2.1L22 19l-2.1.9L19 22l-.9-2.1L16 19l2.1-.9L19 16Z"/></>,
        check: <path d="m5 12 4 4L19 6"/>,
        edit: <><path d="m15 5 4 4M4 20l4.2-.9L19 8.3a2.1 2.1 0 0 0-3-3L5.2 16.1 4 20Z"/></>
      };
      return <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">{paths[name]}</svg>;
    }

    function ProfileCard({ name, role, email, avatarUrl, onReset }) {
      const [following, setFollowing] = useState(false);
      const [likes, setLikes] = useState(0);
      const [online, setOnline] = useState(true);
      const [showEmail, setShowEmail] = useState(false);
      const [editing, setEditing] = useState(false);
      const [avatarFailed, setAvatarFailed] = useState(false);
      const [profileName, setProfileName] = useState(name);
      const [profileRole, setProfileRole] = useState(role);
      const [profileEmail, setProfileEmail] = useState(email);
      const [skills, setSkills] = useState(["HTML", "CSS", "JavaScript", "React"]);
      const [newSkill, setNewSkill] = useState("");
      const [skillMessage, setSkillMessage] = useState("");
      const completion = [Boolean(profileName.trim()), Boolean(profileRole.trim()), Boolean(profileEmail.trim()), skills.length > 0].filter(Boolean).length * 25;

      function addSkill(event) {
        event.preventDefault();
        const cleaned = newSkill.trim();
        if (!cleaned) return;
        if (skills.some(skill => skill.toLowerCase() === cleaned.toLowerCase())) {
          setSkillMessage(cleaned + " is already on your list.");
          return;
        }
        setSkills(current => [...current, cleaned]);
        setNewSkill("");
        setSkillMessage(cleaned + " added to your skills.");
      }

      function deleteSkill(skillToDelete) {
        setSkills(current => current.filter(skill => skill !== skillToDelete));
        setSkillMessage(skillToDelete + " removed.");
      }

      function resetProfile() {
        setProfileName(name);
        setProfileRole(role);
        setProfileEmail(email);
        setSkills(["HTML", "CSS", "JavaScript", "React"]);
        setNewSkill("");
        setSkillMessage("");
        setFollowing(false);
        setLikes(0);
        setOnline(true);
        setShowEmail(false);
        setEditing(false);
        onReset();
      }

      return <>
        <section className="card identity-card" aria-labelledby="profile-name">
          <div className="identity-art"><span className="art-label">Student profile</span></div>
          <div className="avatar-wrap">
            {avatarFailed ? <div className="avatar-fallback" role="img" aria-label={profileName + " avatar"}>MA</div> : <img className="avatar-image" src={avatarUrl} alt={profileName + " profile"} onError={() => setAvatarFailed(true)} />}
            <span className={'online-indicator' + (online ? '' : ' offline')} aria-hidden="true"></span>
          </div>
          <h2 id="profile-name">{profileName || "Your name"}</h2>
          <p className="role">{profileRole || "Add your role"}</p>
          <span className="university"><Icon name="school" />Gachon University</span>
          <div className="status-row"><span className="status-pill"><i className={'status-dot' + (online ? '' : ' offline')}></i>{online ? "Online" : "Offline"}</span></div>
          <div className="divider"></div>
          <p className="profile-summary">Computer Engineering student exploring web development, React, and the building blocks behind interactive experiences.</p>
          <div className="identity-actions">
            <button className={'button' + (following ? ' following' : ' primary')} type="button" onClick={() => setFollowing(value => !value)} aria-pressed={following}>{following ? "Following ✓" : "+ Follow"}</button>
            <button className="button" type="button" onClick={() => setLikes(value => value + 1)} aria-label={'Like profile, ' + likes + ' likes'}>♡ Like · {likes}</button>
          </div>
          <button className="button" type="button" style={{width: '100%', marginTop: 9}} onClick={() => setOnline(value => !value)} aria-pressed={!online}>{online ? "Set status to offline" : "Set status to online"}</button>
        </section>

        <div className="column">
          <section className="card section-card" aria-labelledby="contact-title">
            <div className="section-title-row"><div><h2 id="contact-title">Contact information</h2><p>Choose when your email is visible.</p></div><span className="section-symbol"><Icon name="mail" /></span></div>
            <div className="facts">
              <div className="fact"><span className="fact-icon"><Icon name="mail" /></span><div><span className="fact-label">Email address</span><div className="fact-value">{showEmail ? <a className="email-link" href={'mailto:' + profileEmail}>{profileEmail || "No email added"}</a> : "Hidden until you choose to show it"}</div></div><button className="show-button" type="button" onClick={() => setShowEmail(value => !value)} aria-expanded={showEmail}>{showEmail ? "Hide" : "Show email"}</button></div>
              <div className="fact"><span className="fact-icon"><Icon name="school" /></span><div><span className="fact-label">Field of study</span><div className="fact-value">Computer Engineering</div></div></div>
            </div>
          </section>

          <section className="card section-card" aria-labelledby="skills-title">
            <div className="section-title-row"><div><h2 id="skills-title">Skills I’m learning</h2><p>Add or remove skills to keep this list current.</p></div><span className="section-symbol"><Icon name="spark" /></span></div>
            <div className="skill-list" aria-live="polite">{skills.length ? skills.map(skill => <span className="skill-chip" key={skill}>{skill}<button className="remove-skill" type="button" onClick={() => deleteSkill(skill)} aria-label={'Remove ' + skill} title={'Remove ' + skill}>×</button></span>) : <p className="role">No skills yet. Add one below.</p>}</div>
            <form className="skill-form" onSubmit={addSkill}><label className="sr-only" htmlFor="new-skill">Add a skill</label><input className="input" id="new-skill" value={newSkill} onChange={event => { setNewSkill(event.target.value); setSkillMessage(""); }} placeholder="For example, TypeScript" maxLength="32" /><button className="add-button" type="submit" disabled={!newSkill.trim()}>Add skill</button></form>
            <p className="form-message" aria-live="polite">{skillMessage}</p>
          </section>

          <section className="card section-card" aria-labelledby="completion-title">
            <div className="section-title-row"><div><h2 id="completion-title">Profile completion</h2><p>Fill in the basics to round out your profile.</p></div><span className="section-symbol"><Icon name="check" /></span></div>
            <div className="completion-head"><strong>Profile details</strong><span className="completion-number">{completion}%</span></div>
            <div className="progress" role="progressbar" aria-label="Profile completion" aria-valuemin="0" aria-valuemax="100" aria-valuenow={completion}><div className="progress-bar" style={{width: completion + "%"}}></div></div>
            <p className="completion-caption">{completion === 100 ? "The main profile details are filled in." : "Add your name, role, email, and at least one skill."}</p>
          </section>

          <section className="card section-card" aria-labelledby="edit-title">
            <div className="section-title-row"><div><h2 id="edit-title">Profile details</h2><p>Changes appear on your card as you type.</p></div><span className="section-symbol"><Icon name="edit" /></span></div>
            <button className="button" type="button" aria-expanded={editing} onClick={() => setEditing(value => !value)}>{editing ? "Close editor" : "Edit profile"}</button>
            {editing && <div style={{marginTop: 18}}><div className="edit-form">
              <div className="field"><label htmlFor="profile-name-input">Name</label><input className="input" id="profile-name-input" value={profileName} onChange={event => setProfileName(event.target.value)} placeholder="Enter your name" /></div>
              <div className="field"><label htmlFor="profile-role-input">Role</label><input className="input" id="profile-role-input" value={profileRole} onChange={event => setProfileRole(event.target.value)} placeholder="Enter your role" /></div>
              <div className="field full"><label htmlFor="profile-email-input">Email</label><input className="input" id="profile-email-input" type="email" value={profileEmail} onChange={event => setProfileEmail(event.target.value)} placeholder="name@example.com" /></div>
            </div><p className="edit-notice"><Icon name="check" />Your edits update automatically on this page.</p></div>}
          </section>

          <section className="card section-card reset-row"><p>Want to start over? Reset the profile details, skills, and activity controls to their original values.</p><button className="button danger" type="button" onClick={resetProfile}>Reset profile</button></section>
        </div>
      </>;
    }

    function App() {
      const [dark, setDark] = useState(() => {
        try { return localStorage.getItem("profile-card-theme") === "dark"; } catch { return false; }
      });
      function toggleTheme() {
        setDark(current => {
          const next = !current;
          try { localStorage.setItem("profile-card-theme", next ? "dark" : "light"); } catch {}
          return next;
        });
      }
      return <div className="app" data-theme={dark ? "dark" : "light"}>
        <header className="topbar"><div className="wrap topbar-inner"><a className="brand" href="#top"><span className="brand-mark">MA</span><span>Mahendra Acharya</span></a><p className="top-note">A little space for learning and connecting.</p><div className="top-actions"><button className="top-button" type="button" onClick={toggleTheme} aria-label={'Switch to ' + (dark ? 'light' : 'dark') + ' mode'}><Icon name={dark ? "sun" : "moon"} />{dark ? "Light mode" : "Dark mode"}</button></div></div></header>
        <main id="top"><div className="wrap">
          <div className="page-intro"><div><p className="eyebrow">Student profile</p><h1>My profile</h1><p className="intro-copy">A snapshot of who I am, what I’m learning, and the skills I’m building along the way.</p></div><span className="intro-mark"><Icon name="spark" /></span></div>
          <div className="dashboard"><ProfileCard name="Mahendra Acharya" role="Computer Engineering Student" email="202537251@gachon.ac.kr" avatarUrl="profile.jpg" onReset={() => {}} /></div>
        </div></main>
        <footer className="footer"><div className="wrap footer-inner"><span>Built with React as a profile card practice project.</span><span>Mahendra Acharya · Gachon University</span></div></footer>
      </div>;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
