<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fixed Navigation</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #1e293b;
    }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 40px;
      background: #1e293b;
    }

    .logo {
      color: white;
      font-size: 22px;
      font-weight: bold;
    }

    .nav-links {
      display: flex;
      gap: 24px;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
    }

    .nav-links a:hover {
      color: teal;
    }

    main {
      padding: 100px 40px 40px;
    }

    section {
      min-height: 500px;
      padding: 40px 0;
      border-bottom: 1px solid #cbd5e1;
    }
  </style>
</head>
<body>
  <nav>
    <div class="logo">MyLogo</div>

    <ul class="nav-links">
      <li><a href="#home">Home</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#services">Services</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <main>
    <section id="home">
      <h1>Home</h1>
      <p>Scroll down to see the fixed navigation bar remain at the top.</p>
    </section>

    <section id="about">
      <h2>About</h2>
      <p>This is the about section.</p>
    </section>

    <section id="services">
      <h2>Services</h2>
      <p>This is the services section.</p>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <p>This is the contact section.</p>
    </section>
  </main>
</body>
</html>
