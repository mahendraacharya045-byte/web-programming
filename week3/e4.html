<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Variables</title>
  <style>
    :root {
      --primary: #0f766e;
      --accent: #f59e0b;
      --bg: #f0fdfa;
      --text: #134e4a;
      --radius: 12px;
      --space: 16px;
      --card-bg: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #5eead4;
        --accent: #fbbf24;
        --bg: #0f172a;
        --text: #e2e8f0;
        --card-bg: #1e293b;
      }
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: var(--space);
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .card {
      width: 280px;
      padding: var(--space);
      background: var(--card-bg);
      border: 2px solid var(--primary);
      border-radius: var(--radius);
    }

    button {
      padding: var(--space);
      background: var(--primary);
      color: var(--card-bg);
      border: 0;
      border-radius: var(--radius);
      cursor: pointer;
    }

    button:hover {
      background: var(--accent);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>CSS Variables</h1>
    <p>This card uses variables for its colours, spacing, and border radius.</p>
    <button>Click Me</button>
  </div>
</body>
</html>
