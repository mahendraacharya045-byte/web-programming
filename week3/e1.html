<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    .card {
      width: 280px;
      height: 180px;
      background: white;
      border: 2px solid #0f766e;
      border-radius: 12px;
      position: relative;
      margin: 40px;
      box-sizing: border-box;
    }

    .badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: #0f766e;
      color: white;
      font-size: 12px;
      font-weight: bold;
      padding: 4px 12px;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">SALE</span>
    <p style="padding:16px">hana card</p>
    <p style="padding:16px">Mahendra Acharya</p>
  </div>
</body>
</html>
