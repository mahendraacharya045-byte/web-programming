<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    .card {
      width: 280px;
      height: 180px;
      margin: 40px;
      padding: 20px;
      box-sizing: border-box;
      border: 2px solid #0f766e;
      border-radius: 12px;
      background: white;

      
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 24px rgba(15, 118, 110, 0.35);
    }
  </style>
</head>
<body>
  <div class="card">
    <h3>Hover me</h3>
    <p>mahendra's magic card</p>
  </div>
</body>
</html>
